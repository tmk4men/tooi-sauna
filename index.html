<script>
/* =========================================================================
   とおいサウナ — バトル版
   誰が一番長く入っていられるか。喋らない。ロウリュで他人を熱くできる。
   居心地版（何も達成しない版）は index-居心地版.html に置いてある
   ========================================================================= */

/* ---- 設定 ------------------------------------------------------------- */

// Firebase Realtime Database の URL。空のままだと「ひとり」で動く（体感の確認用）
const DB = "";

// 装備はMVPに入れない。コア（熱・3つの逃がし方・ロウリュ）が面白いかを先に確かめる
const EQUIPMENT = false;

const Q = new URLSearchParams(location.search);
const ROOM        = (Q.get("room") || "main").replace(/[^a-zA-Z0-9_-]/g, "");
const ALWAYS_OPEN = Q.get("open") === "1";        // 開場時刻を待たずに入る（動作確認用）
const FAST        = Q.get("fast") === "1";        // 1回20秒。手触りを確かめるとき3分待たずに済む
const OPEN_FROM   = [0, 30];                      // 毎時00分と30分から
const OPEN_LEN    = 15;                           // 15分ぶん開く
const ROUND_MS    = FAST ? 20000 : 180000;        // 1回は最長3分
const GAP_MS      = FAST ? 6000 : 40000;          // 回と回の間は40秒（脱落者はここで戻る）
const HB_MS       = 2000;
const STALE_MS    = 7000;
const SEAT_FADE   = 2000;

// 熱と体力の設計。ここだけ触れば手触りは変えられる
//   熱   … いまどれだけ熱いか。段ごとの落ち着き先へ向かって上下する（水で下がる）
//   体力 … 熱が高いほど速く減る。戻らない。0で出される
//   ＝水は「延命」であって「解除」ではない。回に必ず終わりと山ができる
const HEAT_MAX    = 100;
const HEAT_K      = FAST ? 0.10 : 0.024;          // 落ち着き先へ近づく速さ。小さいほどじんわり
const SURGE_TAU   = 0.45;                         // ロウリュの熱が乗り切るまでの緩み（秒）
const BAR_TAU_H   = 0.34;                         // 表示上の熱の追従（見た目が跳ねないように）
const BAR_TAU_S   = 0.16;                         // 表示上の体力の追従
const LOOK_TAU    = 0.50;                         // 他人の姿勢の追従（心拍は2秒おきなので滑らかにする）
const HEAT_DROP   = 58;                           // 上段と下段の落ち着き先の差
const STAM_MAX    = 100;
const STAM_BASE   = STAM_MAX / (FAST ? 22 : 120); // 体力の減り。熱で倍率がかかる
const WATER_MAX   = 3;                            // 桶は3杯
const WATER_COOL  = -26;                          // 1杯で下がる熱
const LOYLY_HEAT  = 18;                           // 乗る熱の基準値（段で倍率がかかる）
const LOYLY_AFTER = 15;                           // 降りてから8秒は部屋そのものが熱い

// 呼吸。これが「常にやっていること」＝行動が絶えない核
//   輪がふくらみ切った瞬間にタップすると整う。整っている間は体力の減りが遅い
//   ロウリュが降ると呼吸が乱れて合わせられなくなる＝他人の行動が自分の操作を邪魔する
const BREATH_HIT   = 280;                         // 合ったと見なす前後の幅（ms）
const BREATH_SLOW  = 2.9;                         // 下段の周期（秒）。ゆっくりで合わせやすい
const BREATH_FAST  = 2.0;                         // 上段の周期。速くて難しい
const CALM_GAIN    = 0.22;                        // 合ったとき
const CALM_MISS    = 0.18;                        // 外したとき
const CALM_LAPSE   = 0.16;                        // 1周期まるごと放置したとき
const CALM_RELIEF  = 0.75;                        // 整っていると体力の減りが最大どれだけ緩むか
const DISTURB_MS   = 6000;                        // ロウリュ後、呼吸が乱れている時間
const LOYLY_ROOM  = FAST ? 4000 : 20000;          // ストーブが冷えるまで部屋の誰も打てない
const LOYLY_SELF  = FAST ? 6000 : 40000;          // 1人あたりの間隔
// 予兆。押した瞬間には効かない。ひしゃくの音がしてから降りてくるまでの猶予
// 「他人が急に打つのでタイミングが分からない」を、ここで反応の勝負に変えている
const LOYLY_TELL  = 1800;

/* ---- 決定的な乱数とノイズ --------------------------------------------- */

function hash32(s){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  h ^= h >>> 13; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 16;
  return h >>> 0;
}
const unit = s => hash32(s) / 4294967296;
function ihash(i){ let h = Math.imul(i ^ 0x9e3779b9, 2654435761) >>> 0; h ^= h >>> 15; return (h >>> 0) / 4294967296; }
const smooth = t => t * t * (3 - 2 * t);
function noise(x){
  const i = Math.floor(x), f = x - i;
  return ihash(i) + (ihash(i + 1) - ihash(i)) * smooth(f);
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---- 時刻（サーバー基準。炎も回の進行も全員で一致させる）-------------- */

let clockOffset = 0;
const serverNow = () => Date.now() + clockOffset;
const frameOf   = t => Math.floor(t / 33);

function jstMinuteOfHour(t){ return Math.floor((t + 9 * 3600e3) / 60000) % 60; }
function isOpen(t){
  if (ALWAYS_OPEN) return true;
  const m = jstMinuteOfHour(t);
  return OPEN_FROM.some(s => m >= s && m < s + OPEN_LEN);
}
function openedAt(t){                              // いまの開場が始まった時刻
  if (ALWAYS_OPEN) return 0;                       // 動作確認用。回が延々と切り替わり続ける
  const m = jstMinuteOfHour(t);
  const hourStart = t - m * 60000 - ((t + 9 * 3600e3) % 60000);
  let best = hourStart + OPEN_FROM[0] * 60000;
  for (const s of OPEN_FROM){ const c = hourStart + s * 60000; if (c <= t && c > best) best = c; }
  return best;
}
function nextOpenAt(t){
  const m = jstMinuteOfHour(t);
  const hourStart = t - m * 60000 - ((t + 9 * 3600e3) % 60000);
  for (const s of OPEN_FROM) if (m < s) return hourStart + s * 60000;
  return hourStart + 60 * 60000 + OPEN_FROM[0] * 60000;
}
function clockLabel(t){
  const j = new Date(t + 9 * 3600e3);
  return String(j.getUTCHours()).padStart(2, "0") + ":" + String(j.getUTCMinutes()).padStart(2, "0");
}

// 回（ラウンド）の進行。開場時刻からの経過だけで決まるので通信は要らない
function roundState(t){
  const from = openedAt(t), el = t - from, cyc = ROUND_MS + GAP_MS;
  const idx = Math.floor(el / cyc), into = el % cyc;
  const running = into < ROUND_MS;
  return {
    idx, running,
    startedAt: from + idx * cyc,
    left: running ? ROUND_MS - into : 0,
    toNext: running ? 0 : cyc - into
  };
}

/* ---- 音 ---------------------------------------------------------------- */

const Audio_ = {
  ctx: null, master: null, noiseBuf: null, stoveGain: null, lastCloth: 0,
  start(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);

    const n = this.ctx.sampleRate * 2;
    this.noiseBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++){ const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }

    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 240;
    this.stoveGain = this.ctx.createGain(); this.stoveGain.gain.value = 0.10;
    src.connect(lp).connect(this.stoveGain).connect(this.master); src.start();
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = 0.13;
    const lg = this.ctx.createGain(); lg.gain.value = 0.035;
    lfo.connect(lg).connect(this.stoveGain.gain); lfo.start();
  },
  burst({dur = 0.3, type = "bandpass", f0 = 1200, f1 = 1200, q = 1, vol = 0.2, delay = 0}){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t + dur);
    const gn = this.ctx.createGain();
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(vol, t + Math.min(0.05, dur * 0.2));
    gn.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f).connect(gn).connect(this.master);
    s.start(t); s.stop(t + dur + 0.05);
  },
  tone(f0, f1, dur, vol, type = "sine"){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const gn = this.ctx.createGain();
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn).connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  door(){ this.tone(96, 42, 0.24, 0.3); this.burst({dur:.5, f0:1500, f1:300, q:.7, vol:.16}); },
  hiss(){ this.burst({dur:0.5, f0:5200, f1:2600, q:.8, vol:.10}); },   // ロウリュの予兆
  loyly(){
    this.burst({dur:1.9, f0:7000, f1:900, q:.6, vol:.34});
    this.burst({dur:2.4, f0:400, f1:140, q:.8, vol:.14, delay:.05});
    this.tone(90, 40, 0.3, 0.14);
  },
  water(){ this.burst({dur:.7, f0:2400, f1:600, q:.9, vol:.22}); },
  breathIn(){ this.tone(180, 300, 0.16, 0.09, "sine"); },      // 整った
  breathOff(){ this.tone(150, 96, 0.14, 0.07, "triangle"); },  // 外した
  move(){ this.burst({dur:.22, f0:900, f1:400, q:1.2, vol:.10}); },
  out(){ this.tone(320, 90, 0.5, 0.18, "triangle"); this.burst({dur:.8, f0:1800, f1:400, q:.7, vol:.14}); },
  win(){ this.tone(420, 640, 0.5, 0.16, "sine"); this.tone(640, 880, 0.45, 0.10, "sine"); },
  cloth(t){
    if (t - this.lastCloth < 1100) return;
    this.lastCloth = t;
    this.burst({dur:.18, f0:2600, f1:1400, q:1.4, vol:.055});
  }
};

/* ---- 通信 -------------------------------------------------------------- */

const me = (() => {
  let v = sessionStorage.getItem("tsid");
  if (!v){ v = Math.random().toString(36).slice(2, 10); sessionStorage.setItem("tsid", v); }
  return v;
})();

const Net = {
  live: !!DB, joined: false,
  members: {},                  // id -> {t,j,s,tier,heat,out,r}
  loyly: {},                    // key -> {t}
  seen: false,
  url(p){ return DB.replace(/\/+$/, "") + "/rooms/" + ROOM + p; },

  mine(){ return {t: {".sv": "timestamp"}, s: App.screen === "sauna" ? "i" : "w",
                  tier: Me.tier, heat: Math.round(Me.heat), st: Math.round(Me.stam),
                  out: Me.out ? 1 : 0, r: Me.round}; },
  // DB が無いときの自分の記録（同じ端末の別ウィンドウへ配るのに使う）
  mineLocal(){ return {t: serverNow(), j: this.myJoin || serverNow(),
                       s: App.screen === "sauna" ? "i" : "w", tier: Me.tier,
                       heat: Math.round(Me.heat), st: Math.round(Me.stam),
                       out: Me.out ? 1 : 0, r: Me.round}; },

  // サーバーを立てずに「他人がいる状態」を試すための橋。同じ端末の別ウィンドウ同士だけ繋がる
  // 本番（複数端末）は DB を設定すること。これは確かめ専用
  bus: null,
  initBus(){
    if (typeof BroadcastChannel === "undefined") return;
    this.bus = new BroadcastChannel("tooi-sauna:" + ROOM);
    this.bus.onmessage = e => {
      const d = e.data;
      if (!d) return;
      if (d.k === "m" && d.id !== me){
        this.members[d.id] = Object.assign(this.members[d.id] || {}, d.v);
        this.seen = true;
      } else if (d.k === "bye"){ delete this.members[d.id]; }
      else if (d.k === "l"){ this.loyly[d.key] = {t: d.t}; }
      else if (d.k === "hello" && d.id !== me){ this.say({k: "m", id: me, v: this.mineLocal()}); }
    };
    this.say({k: "hello", id: me});             // 先に居た人に自分を知らせてもらう
  },
  say(msg){ if (this.bus) try { this.bus.postMessage(msg); } catch(e){} },

  async join(){
    if (!this.live){
      this.myJoin = serverNow();
      this.members[me] = this.mineLocal();
      this.joined = true; this.seen = true;
      this.initBus();                                             // 別ウィンドウと繋ぐ
      this.beat(); return;                                        // ひとりでも心拍は要る
    }
    const t0 = Date.now();
    try {
      const body = Object.assign(this.mine(), {j: {".sv": "timestamp"}});
      const r = await fetch(this.url("/m/" + me + ".json"), {method: "PUT", body: JSON.stringify(body)});
      const got = await r.json();
      if (got && typeof got.j === "number") clockOffset = got.j - (t0 + (Date.now() - t0) / 2);
      this.joined = true; this.stream(); this.beat();
    } catch(e){ this.live = false; this.join(); }
  },

  stream(){
    const es = new EventSource(this.url(".json"));
    const apply = (path, data) => {
      const seg = path.split("/").filter(Boolean);
      if (!seg.length){ this.members = (data && data.m) || {}; this.loyly = (data && data.l) || {}; }
      else if (seg[0] === "m"){
        if (seg.length === 1) this.members = data || {};
        else if (data === null) delete this.members[seg[1]];
        else this.members[seg[1]] = Object.assign(this.members[seg[1]] || {}, data);
      } else if (seg[0] === "l"){
        if (seg.length === 1) this.loyly = data || {};
        else if (data === null) delete this.loyly[seg[1]];
        else this.loyly[seg[1]] = data;
      }
      this.seen = true;
    };
    es.addEventListener("put",   e => { const d = JSON.parse(e.data); apply(d.path, d.data); });
    es.addEventListener("patch", e => {
      const d = JSON.parse(e.data);
      for (const k in d.data) apply((d.path === "/" ? "" : d.path) + "/" + k, d.data[k]);
    });
    es.onerror = () => {};
  },

  push(){                        // 動いたら即座に伝える（心拍を待たない）
    if (!this.live){
      const v = this.mineLocal();
      this.members[me] = v;
      this.say({k: "m", id: me, v});
      return;
    }
    fetch(this.url("/m/" + me + ".json"), {method: "PATCH", body: JSON.stringify(this.mine())}).catch(() => {});
  },
  // 心拍。止まると STALE_MS で「居ない人」と見なされるので、ひとりのときも打ち続ける
  beat(){ setInterval(() => { this.push(); if (this.live) this.sweep(); }, HB_MS); },
  sweep(){
    const now = serverNow();
    for (const k in this.loyly)
      if (now - (this.loyly[k].t || 0) > 120000)
        fetch(this.url("/l/" + k + ".json"), {method: "DELETE"}).catch(() => {});
  },
  sendLoyly(){
    if (!this.live){
      const key = "x" + Math.random().toString(36).slice(2), t = serverNow();
      this.loyly[key] = {t};
      this.say({k: "l", key, t});                                  // 別ウィンドウにも降らせる
      return;
    }
    fetch(this.url("/l.json"), {method: "POST", body: JSON.stringify({t: {".sv": "timestamp"}})}).catch(() => {});
  },
  leave(){
    if (!this.joined) return;
    if (!this.live){ this.say({k: "bye", id: me}); return; }
    try { fetch(this.url("/m/" + me + ".json"), {method: "DELETE", keepalive: true}); } catch(e){}
  },
  present(){
    const now = serverNow(), out = [];
    for (const id in this.members){
      const m = this.members[id];
      if (!m || typeof m.t !== "number" || now - m.t > STALE_MS) continue;
      out.push({id, j: m.j || m.t, s: m.s || "i", tier: m.tier | 0,
                heat: clamp(m.heat | 0, 0, HEAT_MAX),
                stam: clamp(typeof m.st === "number" ? m.st : STAM_MAX, 0, STAM_MAX),
                out: !!m.out, r: m.r | 0});
    }
    return out.sort((a, b) => a.id < b.id ? -1 : 1);
  }
};
addEventListener("pagehide", () => Net.leave());
addEventListener("beforeunload", () => Net.leave());

/* ---- 自分の状態 -------------------------------------------------------- */

const Me = {
  tier: 1, heat: 0, stam: STAM_MAX, water: WATER_MAX, out: false, round: -1, lastLoyly: 0,
  calm: 0.5,              // 呼吸が整っている度合い
  surge: 0,               // ロウリュで乗る途中の熱（一気に乗せず、じんわり流し込む）
  dHeat: 0, dStam: STAM_MAX,  // 表示用。実値へ遅れて追いつく
  bPhase: 0,              // 呼吸の位相（0でふくらみ切る）
  bCycle: 0,              // 何周期目か。1周期に判定は1回だけ
  bJudged: -1,            // 判定済みの周期
  bFlash: 0,              // 合った瞬間の手応え
  bMiss: 0,               // 外した瞬間の手応え
  survived: 0, played: 0, // 今夜の記録（この場だけ。保存しない）
  reset(r){
    this.round = r; this.heat = 0; this.stam = STAM_MAX;
    this.surge = 0; this.dHeat = 0; this.dStam = STAM_MAX;
    this.water = WATER_MAX; this.out = false;
    this.tier = Math.min(1, Math.max(0, Seats.tiers - 1));
    this.lastLoyly = 0; this.calm = 0.5;
    this.bPhase = 0; this.bCycle = 0; this.bJudged = -1; this.bFlash = 0; this.bMiss = 0;
  }
};

/* ---- 席（段ごと。下段は席が少ないので取り合いになる）------------------ */

const Seats = {
  list: [], byTier: [], map: {}, ghosts: [], tierY: [], benchH: 0, cap: 0, tiers: 3, want: 20,
  build(W, H, need){
    // 必要席数(want)を覚えておく。cap を need に流し込むと画面を回すたび部屋が増築されてしまう
    // 席を人数より少しだけ多く作る。余らせすぎると閑散として見える
    need = this.want = Math.max(12, need | 0);
    // 段ごとの重み（上段が広く、下段が狭い）。この重みで need をちょうど超えるまで広げる
    const weights = t => Array.from({length: t}, (_, r) => t <= 1 ? 1 : 1 - (r / (t - 1)) * 0.75);
    const seatsFor = (t, base) => weights(t).reduce((a, w) => a + Math.max(1, Math.round(base * w)), 0);
    let tiers = 3, p = 4;
    for (;;){
      const wsum = weights(tiers).reduce((a, b) => a + b, 0);
      p = Math.max(4, Math.ceil(need / wsum));
      while (seatsFor(tiers, p) < need) p++;                // 誰も席から漏れないようにする
      if (p <= 11 || tiers >= 5) break;
      tiers++;
    }
    this.tiers = tiers; this.list = []; this.tierY = []; this.byTier = [];
    this.benchH = H * 0.024;
    const TOP = 0.30, BOT = 0.60;
    for (let r = 0; r < tiers; r++){
      const y = H * (tiers === 1 ? (TOP + BOT) / 2 : TOP + (BOT - TOP) * (r / (tiers - 1)));
      this.tierY.push(y); this.byTier.push([]);
      // 涼しい段ほど席を絞る（下段は全体の1〜2割）。ここが取り合いになる
      const wq = tiers <= 1 ? 1 : 1 - (r / (tiers - 1)) * 0.75;
      const n = Math.max(1, Math.round(p * wq));
      const inset = W * (0.085 + (tiers - 1 - r) * 0.028);
      const span = Math.max(40, W - inset * 2);
      // 端まで広げない。中央へ寄せて座らせる（散ると人数がいても共在が薄く見える）
      const spacing = n > 1 ? Math.min(span / (n - 1), 40) : span;
      const x0 = W / 2 - spacing * (n - 1) / 2;
      const dens = Math.min(1, spacing / 38);
      const depth = tiers === 1 ? 1 : r / (tiers - 1);
      const s = (0.74 + depth * 0.26) * Math.max(0.62, dens);
      for (let i = 0; i < n; i++){
        const x = n === 1 ? W / 2 : x0 + spacing * i;
        this.byTier[r].push(this.list.length);
        this.list.push({x, y, s, tier: r});
      }
    }
    this.cap = this.list.length;
  },
  ensure(n){ if (n > this.cap) this.build(W, H, n + 4); },

  // 希望の段に空きが無ければ、より熱い段へ回される。全端末で同じ結果になるよう id 順に決める
  assign(people){
    const taken = {}, next = {};
    for (const p of people){
      if (p.out) continue;
      const want = clamp(p.tier, 0, this.tiers - 1);
      let placed = -1;
      for (let d = 0; d < this.tiers && placed < 0; d++){
        for (const cand of [want + d, want - d]){        // 空いてなければ上段（熱い方）優先で寄せる
          if (cand < 0 || cand >= this.tiers) continue;
          const row = this.byTier[cand], L = row.length;
          let k = hash32(p.id) % L;
          for (let i = 0; i < L; i++){
            const idx = row[(k + i) % L];
            if (!taken[idx]){ taken[idx] = p.id; placed = idx; break; }
          }
          if (placed >= 0) break;
        }
      }
      if (placed >= 0) next[p.id] = placed;
    }
    for (const id in this.map)
      if (!(id in next) && this.list[this.map[id]])
        this.ghosts.push({seat: this.map[id], id, t: performance.now()});
    this.map = next;
    this.ghosts = this.ghosts.filter(gh => performance.now() - gh.t < SEAT_FADE && !(gh.id in next));
  },
  tierOf(id){ const s = this.list[this.map[id]]; return s ? s.tier : -1; },
  freeIn(tier, people){                                   // その段に空きがあるか（ボタンの可否用）
    const row = this.byTier[tier] || [];
    let used = 0;
    for (const p of people) if (!p.out && Seats.tierOf(p.id) === tier) used++;
    return used < row.length;
  }
};

/* ---- 部屋の温度（見た目と地獄の演出に使う）---------------------------- */

// 段ごとの熱の落ち着き先。上段ほど熱い
function heatEquilibrium(tier, tiers, loylyRecent){
  const t = tier < 0 ? 1 : tier;
  const d = tiers <= 1 ? 0 : (t / (tiers - 1)) * HEAT_DROP;
  return clamp(HEAT_MAX - d + (loylyRecent ? LOYLY_AFTER : 0), 0, HEAT_MAX + LOYLY_AFTER);
}
// 体力の減り。熱いほど速く、呼吸が整っているほど緩む（＝腕で2倍近く変わる）
function drainRate(heat, calm){
  const h = clamp(heat / HEAT_MAX, 0, 1);
  const c = clamp(calm === undefined ? 0.5 : calm, 0, 1);
  return STAM_BASE * (0.35 + 1.15 * Math.pow(h, 1.5)) * (1 + CALM_RELIEF * (0.6 - c));
}
// ロウリュは段で効きが変わる。上段が最も食らう＝どこに座るかが読み合いになる
function loylyBite(tier, tiers){
  const d = tiers <= 1 ? 0 : (tier < 0 ? 1 : tier) / (tiers - 1);
  return 1.8 - d * 1.45;                                   // 上段1.8 → 下段0.35
}
// 呼吸の周期。上段は速くて合わせにくい。乱れているとさらに速くなる
function breathPeriod(tier, tiers, disturb){
  const d = tiers <= 1 ? 0 : (tier < 0 ? 1 : tier) / (tiers - 1);
  return (BREATH_FAST + (BREATH_SLOW - BREATH_FAST) * d) * (1 - 0.25 * clamp(disturb, 0, 1));
}

function temperature(alive, now, events){
  let t = 78 + 0.35 * alive;
  for (const e of events.loyly){ const a = now - e.t; if (a >= 0 && a < 30000) t += 3.0 * Math.exp(-a / 13000); }
  for (const e of events.door){ const a = now - e.t; if (a >= 0 && a < 9000) t -= 0.5 * (1 - a / 9000); }
  return clamp(t, 68, 112);
}

/* ---- 描画 -------------------------------------------------------------- */

const cv = document.getElementById("c"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  Seats.build(W, H, Seats.want || 12);
}
addEventListener("resize", resize);

const COL = { bg:"#0d0906", wood:"#241812", wood2:"#2c1d15", body:"#120e0b", text:"#e8dcd0", fire:"#ff7a1a", core:"#ffd08a" };

// 炎のゆらぎ。部屋全体の明るさがこれに同期する＝火が本当の光源に見える
// 決定的なので、全端末で同じ瞬間に同じだけ揺れる
let Flick = 1;
const flickerOf = t => {
  const F = frameOf(t);
  return 0.88 + 0.12 * (0.62 * noise(F / 6) + 0.38 * noise(F / 14));
};

// フィルムの粒子。平坦なベクター感を消す。タイルを1枚だけ作って敷き詰める
let grainTile = null;
function drawGrain(t){
  if (!grainTile){
    const n = 128;
    grainTile = document.createElement("canvas");
    grainTile.width = grainTile.height = n;
    const gg = grainTile.getContext("2d");
    const img = gg.createImageData(n, n);
    for (let i = 0; i < n * n; i++){
      const v = 118 + Math.floor(unit("gr" + i) * 74);
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    gg.putImageData(img, 0, 0);
  }
  const step = Math.floor(frameOf(t) / 4);
  const ox = -(step * 37) % 128, oy = -(step * 61) % 128;
  g.save();
  g.globalAlpha = 0.045;
  g.globalCompositeOperation = "overlay";
  for (let x = ox; x < W; x += 128)
    for (let y = oy; y < H; y += 128) g.drawImage(grainTile, x, y);
  g.restore();
}

function rr(x, y, w, h, r){
  g.beginPath();
  r = Math.min(r, w / 2, h / 2);
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function drawRoom(doorGlow){
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, "#070505"); grd.addColorStop(0.38, "#150e0a");
  grd.addColorStop(0.78, "#20150e"); grd.addColorStop(1, "#2a1a11");
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  // 天井。奥へ落ちる
  const ceil = H * 0.085;
  const cg = g.createLinearGradient(0, 0, 0, ceil);
  cg.addColorStop(0, "rgba(0,0,0,0.55)"); cg.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = cg; g.fillRect(0, 0, W, ceil * 1.6);

  // 壁は横張り。板の上端に光、下端に影を置くと厚みが出る。板ごとに木目を散らす
  const post = W * 0.055;
  let bi = 0;
  for (let y = ceil; y < H * 0.72; y += 15){
    const shine = (0.030 + unit("bd" + bi) * 0.030) * Flick;
    g.fillStyle = "rgba(255,196,140," + shine.toFixed(3) + ")"; g.fillRect(post, y, W - post * 2, 1);
    g.fillStyle = "rgba(0,0,0,0.20)"; g.fillRect(post, y + 1, W - post * 2, 1.5);
    for (let k = 0; k < 3; k++){                                  // 木目
      const gx = post + (W - post * 2) * unit("gx" + bi + "_" + k);
      const gw2 = 18 + unit("gw" + bi + "_" + k) * 52;
      g.fillStyle = "rgba(0,0,0,0.11)";
      g.fillRect(gx, y + 4 + unit("gy" + bi + "_" + k) * 7, gw2, 1);
    }
    bi++;
  }
  // 角の柱。部屋の箱が締まる
  for (const px of [0, W - post]){
    const pg = g.createLinearGradient(px, 0, px + post, 0);
    pg.addColorStop(0, "rgba(0,0,0,0.42)"); pg.addColorStop(0.7, "rgba(0,0,0,0.10)");
    pg.addColorStop(1, "rgba(255,190,130,0.05)");
    g.fillStyle = pg; g.fillRect(px, 0, post, H * 0.74);
  }

  // ドア。枠と蝶番があるだけで「扉」に見える
  const dw = Math.min(62, W * 0.15), dh = H * 0.175, dx = post + W * 0.012, dy = H * 0.105;
  g.fillStyle = "rgba(0,0,0,0.30)"; rr(dx - 3, dy - 3, dw + 6, dh + 6, 3); g.fill();
  const dg = g.createLinearGradient(dx, 0, dx + dw, 0);
  dg.addColorStop(0, "#1c130d"); dg.addColorStop(1, "#120c08");
  g.fillStyle = dg; rr(dx, dy, dw, dh, 2); g.fill();
  g.strokeStyle = "rgba(255,190,130,0.13)"; g.lineWidth = 1;
  rr(dx + 5, dy + 5, dw - 10, dh - 10, 1.5); g.stroke();
  g.fillStyle = "rgba(255,200,145,0.16)";                       // 蝶番
  g.fillRect(dx + 1, dy + dh * 0.18, 3, 7); g.fillRect(dx + 1, dy + dh * 0.72, 3, 7);
  g.fillStyle = "rgba(255,205,150,0.20)";                       // 取っ手
  rr(dx + dw - 11, dy + dh / 2 - 8, 3, 16, 1.5); g.fill();
  const seam = 0.06 + doorGlow * 0.66;                          // 開くと外の冷気の色が差す
  g.fillStyle = "rgba(198,224,255," + seam.toFixed(3) + ")";
  g.fillRect(dx + dw - 1.5, dy + 3, 2, dh - 6);
  if (doorGlow > 0.02){                                         // 冷気は四方へ滲ませる（縁を出さない）
    const sx2 = dx + dw, sy2 = dy + dh * 0.55, sr = dw * 3.2;
    const sp = g.createRadialGradient(sx2, sy2, 2, sx2, sy2, sr);
    sp.addColorStop(0, "rgba(186,218,255," + (doorGlow * 0.13).toFixed(3) + ")");
    sp.addColorStop(0.55, "rgba(186,218,255," + (doorGlow * 0.045).toFixed(3) + ")");
    sp.addColorStop(1, "rgba(186,218,255,0)");
    g.fillStyle = sp; g.fillRect(0, 0, W, H * 0.74);
  }

  // 段。奥は狭く手前は広い台形にして、天面が見えるようにする＝部屋の奥行きが出る
  const cx = W / 2, tiers = Seats.tierY.length;
  for (let i = 0; i < tiers; i++){
    const depth = tiers === 1 ? 1 : i / (tiers - 1);       // 0=奥 1=手前
    const y = Seats.tierY[i] + 2, bh = Seats.benchH, top = 7 + depth * 5;
    const hb = W * (0.34 + 0.20 * depth), hf = hb + W * 0.035;
    const dim = 0.55 + depth * 0.45;                       // 奥は空気に沈む

    g.fillStyle = "rgba(0,0,0,0.34)";                      // 落ち影
    g.beginPath();
    g.moveTo(cx - hf, y + top + bh); g.lineTo(cx + hf, y + top + bh);
    g.lineTo(cx + hf + 6, y + top + bh + 7); g.lineTo(cx - hf - 6, y + top + bh + 7);
    g.closePath(); g.fill();

    const fg = g.createLinearGradient(0, y + top, 0, y + top + bh);            // 前面
    fg.addColorStop(0, "rgba(" + Math.round(58 * dim) + "," + Math.round(40 * dim) + "," + Math.round(28 * dim) + ",1)");
    fg.addColorStop(1, "rgba(" + Math.round(22 * dim) + "," + Math.round(15 * dim) + "," + Math.round(10 * dim) + ",1)");
    g.fillStyle = fg;
    g.beginPath();
    g.moveTo(cx - hf, y + top); g.lineTo(cx + hf, y + top);
    g.lineTo(cx + hf, y + top + bh); g.lineTo(cx - hf, y + top + bh);
    g.closePath(); g.fill();
    for (let k = -7; k <= 7; k++){                                             // スラットの継ぎ目
      const sx = cx + k * (hf / 7.2);
      g.fillStyle = "rgba(0,0,0,0.26)"; g.fillRect(sx, y + top, 1.5, bh);
    }

    const tg = g.createLinearGradient(0, y, 0, y + top);                       // 天面
    tg.addColorStop(0, "rgba(" + Math.round(96 * dim) + "," + Math.round(68 * dim) + "," + Math.round(48 * dim) + ",1)");
    tg.addColorStop(1, "rgba(" + Math.round(52 * dim) + "," + Math.round(36 * dim) + "," + Math.round(25 * dim) + ",1)");
    g.fillStyle = tg;
    g.beginPath();
    g.moveTo(cx - hb, y); g.lineTo(cx + hb, y);
    g.lineTo(cx + hf, y + top); g.lineTo(cx - hf, y + top);
    g.closePath(); g.fill();
    for (let k = 0; k < 5; k++){                                               // 天面の木目
      const gy = y + top * (0.2 + k * 0.17);
      const t2 = (gy - y) / top, hx = hb + (hf - hb) * t2;
      g.fillStyle = "rgba(0,0,0,0.10)"; g.fillRect(cx - hx, gy, hx * 2, 0.8);
    }
    g.fillStyle = "rgba(255,214,164," + ((0.10 + depth * 0.09) * Flick).toFixed(3) + ")"; // 角の光
    g.fillRect(cx - hb, y, hb * 2, 1.2);
  }
}

// 熱気。うっすら層になって漂う＋ストーブの真上は陽炎で歪む
function drawHaze(t, hell){
  const F = frameOf(t);
  for (let i = 0; i < 3; i++){
    const y = H * (0.30 + i * 0.17) + Math.sin(F / 90 + i * 2.1) * 8;
    const hz = g.createLinearGradient(0, y - H * 0.09, 0, y + H * 0.09);
    hz.addColorStop(0, "rgba(255,190,140,0)");
    hz.addColorStop(0.5, "rgba(255,190,140," + (0.020 + hell * 0.022).toFixed(3) + ")");
    hz.addColorStop(1, "rgba(255,190,140,0)");
    g.fillStyle = hz; g.fillRect(0, y - H * 0.09, W, H * 0.18);
  }
  const cx = W / 2, base = H * 0.82;                       // 陽炎
  for (let i = 0; i < 7; i++){
    const p = i / 7;
    const yy = base - H * 0.10 - p * H * 0.30;
    const off = Math.sin(F / 26 + i * 1.7) * (4 + p * 9);
    g.fillStyle = "rgba(255,206,150," + ((1 - p) * (0.045 + hell * 0.03)).toFixed(3) + ")";
    g.fillRect(cx - W * 0.16 + off, yy, W * 0.32, 2.2);
  }
}

// 四隅を落として中央に目を集める。人と炎を描いたあとに重ねる
function drawVignette(hell){
  const v = g.createRadialGradient(W / 2, H * 0.62, Math.min(W, H) * 0.28, W / 2, H * 0.62, Math.max(W, H) * 0.78);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(0,0,0," + (0.52 - hell * 0.12).toFixed(3) + ")");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ready: 誰かが打てる状態（石が赤熱する＝いつ来得るかが全員に見える）
// tell : 0→1 で予兆の進行（石が白く光る＝いま来る）
function drawStove(t, hell, ready, tell){
  const cx = W / 2, base = H * 0.82, w = Math.min(118, W * 0.30), h = H * 0.085;
  const F = frameOf(t);

  const glow = g.createRadialGradient(cx, base - h * 0.7, 4, cx, base - h * 0.7, w * 1.9);
  glow.addColorStop(0, "rgba(255,140,50," + (0.30 + hell * 0.22).toFixed(3) + ")");
  glow.addColorStop(1, "rgba(255,100,20,0)");
  g.fillStyle = glow; g.fillRect(cx - w * 2, base - h * 3.4, w * 4, h * 4.6);

  // 炉。鉄の胴に吸気の隙間。脚を付けて床から浮かせる
  const bx = cx - w / 2, byTop = base - h;
  g.fillStyle = "rgba(0,0,0,0.40)";                                   // 床の影
  g.beginPath(); g.ellipse(cx, base + 3, w * 0.60, h * 0.13, 0, 0, 6.284); g.fill();
  g.fillStyle = "#120c08";
  g.fillRect(bx + w * 0.12, base - 3, w * 0.08, 6); g.fillRect(bx + w * 0.80, base - 3, w * 0.08, 6);
  const mg = g.createLinearGradient(bx, byTop, bx + w, base);
  mg.addColorStop(0, "#241a15"); mg.addColorStop(0.45, "#171009"); mg.addColorStop(1, "#0e0906");
  g.fillStyle = mg; rr(bx, byTop, w, h, 4); g.fill();
  g.strokeStyle = "rgba(255,196,140,0.10)"; g.lineWidth = 1; rr(bx, byTop, w, h, 4); g.stroke();
  for (let i = 0; i < 6; i++){                                        // 吸気の隙間
    const vx = bx + w * (0.18 + i * 0.13);
    g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(vx, base - h * 0.42, 3, h * 0.26);
    g.fillStyle = "rgba(255,140,60," + (ready ? 0.22 : 0.10).toFixed(3) + ")";
    g.fillRect(vx, base - h * 0.42, 3, h * 0.10);
  }

  // サウナストーン。冷えていれば暗く、打てるなら赤熱し、予兆の間は白く光る
  const pulse = 0.5 + 0.5 * Math.sin(t / 320);
  for (let i = 0; i < 15; i++){
    const a = unit("st" + i), b2 = unit("sb" + i);
    const sx = bx + 7 + (w - 14) * a;
    const sy = byTop + 3 + b2 * (h * 0.30) - (1 - Math.abs(a - 0.5) * 2) * h * 0.10;  // 中央が高い山
    const rx = 4.5 + a * 3.5, ry = 3.4 + b2 * 2.2;
    g.fillStyle = i % 3 ? "#2e2620" : "#3a3129";
    g.beginPath(); g.ellipse(sx, sy, rx, ry, a * 3, 0, 6.284); g.fill();
    g.fillStyle = "rgba(255,235,210,0.07)";                           // 石の上の光
    g.beginPath(); g.ellipse(sx - rx * 0.2, sy - ry * 0.35, rx * 0.55, ry * 0.4, a * 3, 0, 6.284); g.fill();
    let heatA = 0, cr = 255, cg2 = 90, cb = 30;
    if (tell > 0){ heatA = 0.40 + 0.60 * tell; cg2 = 235; cb = 205; }
    else if (ready){ heatA = 0.26 + 0.32 * pulse; }
    if (heatA > 0){
      g.fillStyle = "rgba(" + cr + "," + cg2 + "," + cb + "," + heatA.toFixed(3) + ")";
      g.beginPath(); g.ellipse(sx, sy + ry * 0.25, rx * 0.85, ry * 0.7, a * 3, 0, 6.284); g.fill();
    }
  }

  // 桶とひしゃく。予兆の間はひしゃくが持ち上がって傾く＝合図が「動作」になる
  const wx = cx + w * 0.74, wy = base, bw2 = Math.max(15, w * 0.20), bh2 = bw2 * 0.85;
  g.fillStyle = "rgba(0,0,0,0.35)";
  g.beginPath(); g.ellipse(wx, wy + 2, bw2 * 0.62, bh2 * 0.16, 0, 0, 6.284); g.fill();
  const kg = g.createLinearGradient(wx - bw2 / 2, 0, wx + bw2 / 2, 0);
  kg.addColorStop(0, "#2a1d14"); kg.addColorStop(0.5, "#3d2b1e"); kg.addColorStop(1, "#22170f");
  g.fillStyle = kg;
  g.beginPath();
  g.moveTo(wx - bw2 * 0.5, wy - bh2); g.lineTo(wx + bw2 * 0.5, wy - bh2);
  g.lineTo(wx + bw2 * 0.40, wy); g.lineTo(wx - bw2 * 0.40, wy); g.closePath(); g.fill();
  g.strokeStyle = "rgba(255,206,152,0.14)"; g.lineWidth = 1.2;        // たが
  g.beginPath(); g.moveTo(wx - bw2 * 0.47, wy - bh2 * 0.72); g.lineTo(wx + bw2 * 0.47, wy - bh2 * 0.72); g.stroke();
  g.beginPath(); g.moveTo(wx - bw2 * 0.43, wy - bh2 * 0.28); g.lineTo(wx + bw2 * 0.43, wy - bh2 * 0.28); g.stroke();
  g.strokeStyle = "rgba(120,170,210,0.20)"; g.lineWidth = 1.5;        // 水面
  g.beginPath(); g.moveTo(wx - bw2 * 0.44, wy - bh2 * 0.86); g.lineTo(wx + bw2 * 0.44, wy - bh2 * 0.86); g.stroke();

  g.save();
  g.translate(wx + bw2 * 0.42, wy - bh2 * 0.92);
  g.rotate(tell > 0 ? -0.30 - 0.95 * tell : 0.30);                    // 持ち上がって傾く
  g.strokeStyle = "rgba(214,178,132," + (tell > 0 ? 0.85 : 0.42).toFixed(3) + ")";
  g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(bw2 * 1.15, -bw2 * 0.30); g.stroke();
  g.fillStyle = "rgba(196,158,112," + (tell > 0 ? 0.90 : 0.48).toFixed(3) + ")";
  g.beginPath(); g.ellipse(-bw2 * 0.10, bw2 * 0.05, bw2 * 0.22, bw2 * 0.16, 0.3, 0, 6.284); g.fill();
  g.restore();
  // 予兆。1.8秒しかないので、見落とさない強さで出す
  if (tell > 0){
    const my = base - h * 0.6;
    const tg = g.createRadialGradient(cx, my, 2, cx, my, w * 2.6);
    tg.addColorStop(0, "rgba(255,242,220," + (0.22 + 0.34 * tell).toFixed(3) + ")");
    tg.addColorStop(1, "rgba(255,242,220,0)");
    g.fillStyle = tg; g.fillRect(0, base - h * 5, W, h * 6.5);

    for (let k = 0; k < 2; k++){                               // 石から輪が広がる
      const p = (tell + k * 0.5) % 1;
      g.strokeStyle = "rgba(255,246,228," + ((1 - p) * 0.5).toFixed(3) + ")";
      g.lineWidth = 2.5 * (1 - p) + 0.5;
      g.beginPath(); g.ellipse(cx, my, w * 0.28 + p * w * 1.5, h * 0.2 + p * h * 1.0, 0, 0, 6.284); g.stroke();
    }
    g.fillStyle = "rgba(255,246,232," + (0.05 + 0.10 * tell * tell).toFixed(3) + ")";
    g.fillRect(0, 0, W, H);                                   // 部屋全体が張りつめる
  }

  const y0 = base - h * 0.52, fh = h * (2.1 + hell * 0.8);
  const layers = [
    {n: 4, w: 1.15, h: 1.00, a: "rgba(255,105,25,0.20)", b: "rgba(175,32,4,0)"},
    {n: 5, w: 0.80, h: 0.74, a: "rgba(255,158,52,0.38)", b: "rgba(212,62,9,0)"},
    {n: 4, w: 0.48, h: 0.44, a: "rgba(255,230,182,0.72)", b: "rgba(255,182,88,0)"}
  ];
  for (let L = 0; L < layers.length; L++){
    const ly = layers[L];
    for (let i = 0; i < ly.n; i++){
      const n1 = noise(F / 10 + i * 37.7 + L * 13.3);
      const n2 = noise(F / 15 + i * 91.3 + L * 71.1);
      const n3 = noise(F / 8 + i * 53.1 + L * 29.7);
      const px = cx + (ly.n === 1 ? 0 : (i / (ly.n - 1) - 0.5)) * w * 0.34;
      const hgt = fh * ly.h * (0.62 + 0.48 * n1);
      const lean = (n2 - 0.5) * w * 0.09;
      const wid = (w / (ly.n + 2)) * ly.w * (0.8 + 0.4 * n3);
      const grd = g.createLinearGradient(px, y0, px, y0 - hgt);
      grd.addColorStop(0, ly.a); grd.addColorStop(0.55, ly.a); grd.addColorStop(1, ly.b);
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(px - wid, y0);
      g.bezierCurveTo(px - wid * 0.98, y0 - hgt * 0.34, px - wid * 0.52 + lean, y0 - hgt * 0.76, px + lean, y0 - hgt);
      g.bezierCurveTo(px + wid * 0.52 + lean, y0 - hgt * 0.76, px + wid * 0.98, y0 - hgt * 0.34, px + wid, y0);
      g.closePath(); g.fill();
    }
  }
  const bg2 = g.createRadialGradient(cx, y0, 1, cx, y0, w * 0.3);
  bg2.addColorStop(0, "rgba(255,205,140,0.40)"); bg2.addColorStop(1, "rgba(255,150,60,0)");
  g.fillStyle = bg2; g.beginPath(); g.ellipse(cx, y0, w * 0.3, h * 0.17, 0, 0, 6.284); g.fill();

  for (let i = 0; i < 11; i++){
    const life = ((F * 1.5 + i * 143) % 240) / 240;
    const ex = cx + (noise(F / 26 + i * 11.1) - 0.5) * w * 0.8;
    const ey = y0 - life * fh * 1.15;
    g.fillStyle = "rgba(255,175,90," + ((1 - life) * 0.42).toFixed(3) + ")";
    g.beginPath(); g.arc(ex, ey, 0.9 + (1 - life) * 1.1, 0, 6.284); g.fill();
  }
}

// 熱は数字で出さない。姿勢で見せる（前に屈む・うつむく）
function drawPerson(x, y, s, id, alpha, isMe, heat, slump, stam, jolt){
  const t = serverNow();
  const per = 3.2 + unit("p" + id) * 1.9;
  const ph = unit("q" + id) * 6.283;
  const hot = clamp(heat / HEAT_MAX, 0, 1);
  const spent = 1 - clamp((stam === undefined ? STAM_MAX : stam) / STAM_MAX, 0, 1);
  const rate = 1 - hot * 0.45;                                    // 熱いと呼吸が浅く速い
  const br = Math.sin((t / 1000) * (6.283 / (per * rate)) + ph);
  const U = 62 * s;                                    // 座った全高を基準に組む
  const j = clamp(jolt === undefined ? 0 : jolt, 0, 1);
  // 熱いと前に屈み、体力が尽きてくるとさらに沈む＝数字を見なくても限界が分かる
  // jolt はロウリュを食らった瞬間のすくみ。上段の人ほど大きく縮む＝当たったのが見える
  // 姿勢は人ごとに違える。同じ人形が並ぶと一気に嘘っぽくなる
  const pose = unit("ps" + id);                        // 0.62超＝背をあずけて座る人
  const leanBack = pose > 0.62;
  const hunch = hot * 0.20 + spent * 0.26 + j * 0.34 + (slump ? 0.52 : 0)
              + unit("po" + id) * 0.10 - (leanBack ? 0.16 : 0);
  const hipY  = y - U * 0.015 + br * U * 0.004;
  const torso = U * (0.44 - hunch * 0.13);
  const shldY = hipY - torso;
  const hr    = U * 0.125;                             // 頭は小さく。ここを外すと人形になる
  const neck  = U * 0.055;
  const headX = x + hunch * U * 0.20;
  const headY = shldY - neck - hr + hunch * U * 0.13;
  const shldW = U * (0.42 + br * 0.008), hipW = U * 0.34;

  g.globalAlpha = alpha;

  // 光源はストーブだけ。体の「火に向いた側」が明るく、反対側は闇に落ちる
  const LX = W / 2, LY = H * 0.80;
  const midY = shldY + torso * 0.5;
  const dxl = LX - x, dyl = LY - midY;
  const dist = Math.hypot(dxl, dyl) || 1;
  const ux = dxl / dist, uy = dyl / dist;
  const fall = clamp(1 - (dist / (Math.max(W, H) * 0.62)), 0.34, 1);   // 遠いほど暗い（沈み切らせない）
  const lit = (0.50 + 0.40 * fall + hot * 0.12) * Flick;               // 炎のゆらぎに同期

  // 火だけの部屋では人は影絵になる。中は暗く保ち、火に向いた縁だけを立てる
  const shade = (a, b) => {
    const gr = g.createLinearGradient(x - ux * U * a, midY - uy * U * a,
                                      x + ux * U * b, midY + uy * U * b);
    gr.addColorStop(0, "rgba(7,5,4,1)");
    gr.addColorStop(0.62, "rgba(" + Math.round(30 * lit) + "," + Math.round(18 * lit) + "," + Math.round(12 * lit) + ",1)");
    gr.addColorStop(1, "rgba(" + Math.round(118 * lit) + "," + Math.round(68 * lit) + "," + Math.round(38 * lit) + ",1)");
    return gr;
  };
  const body = shade(0.52, 0.52);

  // 段に落ちる影。火と反対側へ伸びる
  g.fillStyle = "rgba(0,0,0,0.38)";
  g.beginPath();
  g.ellipse(x - ux * U * 0.30, y + U * 0.05, U * 0.42, U * 0.10, 0, 0, 6.284);
  g.fill();

  const tremble = (spent > 0.70 && !slump) ? Math.sin(t / 55 + unit("f" + id) * 6.283) * U * 0.012 : 0;
  const px = x + tremble;

  // 脚。腿から脛までひと続きにする（分けると椅子の脚に見える）
  // 明暗は脚の位置で取り直す。胴の勾配を流用すると脚だけ光って棒に見える
  const legShade = (() => {
    const ly = y + U * 0.12;
    const gr = g.createLinearGradient(px - ux * U * 0.42, ly - uy * U * 0.42,
                                      px + ux * U * 0.42, ly + uy * U * 0.42);
    const k = lit * 0.72;
    gr.addColorStop(0, "rgba(6,4,4,1)");
    gr.addColorStop(0.6, "rgba(" + Math.round(26 * k) + "," + Math.round(16 * k) + "," + Math.round(11 * k) + ",1)");
    gr.addColorStop(1, "rgba(" + Math.round(92 * k) + "," + Math.round(54 * k) + "," + Math.round(31 * k) + ",1)");
    return gr;
  })();
  g.lineJoin = "round"; g.lineCap = "round";
  g.fillStyle = legShade; g.strokeStyle = legShade;
  for (const sgn of [-1, 1]){
    g.lineWidth = U * 0.135;                           // 腿
    g.beginPath();
    g.moveTo(px + sgn * hipW * 0.22, hipY - U * 0.02);
    g.lineTo(px + sgn * hipW * 0.46, y + U * 0.045);
    g.stroke();
    g.lineWidth = U * 0.105;                           // 脛
    g.beginPath();
    g.moveTo(px + sgn * hipW * 0.46, y + U * 0.035);
    g.lineTo(px + sgn * hipW * 0.50, y + U * 0.30);
    g.stroke();
  }
  g.lineCap = "butt";

  // 胴
  const torsoPath = () => {
    g.beginPath();
    g.moveTo(px - shldW / 2, shldY + hr * 0.34);
    g.quadraticCurveTo(px, shldY - hr * 0.22, px + shldW / 2, shldY + hr * 0.34);
    g.quadraticCurveTo(px + hipW * 0.60, hipY - torso * 0.34, px + hipW * 0.54, hipY);
    g.lineTo(px - hipW * 0.54, hipY);
    g.quadraticCurveTo(px - hipW * 0.60, hipY - torso * 0.34, px - shldW / 2, shldY + hr * 0.34);
    g.closePath();
  };
  g.fillStyle = body; torsoPath(); g.fill();

  // 腰のタオル。布なので照り返しは弱く、幅は腰までに収める
  const tw = g.createLinearGradient(px - ux * U * 0.4, 0, px + ux * U * 0.4, 0);
  tw.addColorStop(0, "rgba(" + Math.round(26 * lit) + "," + Math.round(24 * lit) + "," + Math.round(21 * lit) + ",1)");
  tw.addColorStop(1, "rgba(" + Math.round(146 * lit) + "," + Math.round(133 * lit) + "," + Math.round(116 * lit) + ",1)");
  g.fillStyle = tw;
  g.beginPath();
  g.moveTo(px - hipW * 0.52, hipY - U * 0.055);
  g.lineTo(px + hipW * 0.52, hipY - U * 0.055);
  g.lineTo(px + hipW * 0.50, hipY + U * 0.015);
  g.lineTo(px - hipW * 0.50, hipY + U * 0.015);
  g.closePath(); g.fill();

  // 腕。膝に置く人と、後ろに手をついて背をあずける人がいる
  g.fillStyle = body;
  g.lineJoin = "round"; g.lineCap = "round";
  g.strokeStyle = body; g.lineWidth = U * 0.095;
  for (const sgn of [-1, 1]){
    g.beginPath();
    g.moveTo(px + sgn * shldW * 0.42, shldY + hr * 0.46);
    if (leanBack)
      g.quadraticCurveTo(px + sgn * shldW * 0.86, shldY + torso * 0.55,
                         px + sgn * hipW * 0.88, hipY - U * 0.01);
    else
      g.quadraticCurveTo(px + sgn * shldW * 0.62, shldY + torso * 0.66,
                         px + sgn * hipW * 0.42, hipY - U * 0.02);
    g.stroke();
  }

  // 首と頭
  g.lineWidth = U * 0.105;
  g.beginPath(); g.moveTo(px, shldY + hr * 0.05); g.lineTo(headX + tremble, headY + hr * 0.70); g.stroke();
  g.lineCap = "butt"; g.lineJoin = "miter";
  g.fillStyle = shade(0.5, 0.5);
  g.beginPath(); g.ellipse(headX + tremble, headY, hr * 0.86, hr, 0, 0, 6.284); g.fill();

  // 火に向いた縁だけ強く光る。汗の照り返し
  g.strokeStyle = "rgba(255," + Math.round(186 * fall + 40) + "," + Math.round(112 * fall + 30) + "," + (0.30 + fall * 0.34).toFixed(3) + ")";
  g.lineWidth = Math.max(0.9, U * 0.030);
  g.beginPath();
  g.arc(headX + tremble, headY, hr * 0.90, Math.atan2(uy, ux) - 1.15, Math.atan2(uy, ux) + 1.15);
  g.stroke();
  g.save();
  torsoPath(); g.clip();
  g.beginPath();
  g.arc(px + ux * shldW * 0.44, midY + uy * torso * 0.30, torso * 0.62,
        Math.atan2(uy, ux) - 1.3, Math.atan2(uy, ux) + 1.3);
  g.lineWidth = Math.max(1.1, U * 0.045); g.stroke();
  g.restore();

  // サウナハット。3人に2人はかぶっている
  if (unit("hat" + id) > 0.34){
    const hw = hr * 1.34, hx = headX + tremble;
    const hg = g.createLinearGradient(hx - ux * hw, 0, hx + ux * hw, 0);
    hg.addColorStop(0, "rgba(" + Math.round(46 * lit) + "," + Math.round(42 * lit) + "," + Math.round(36 * lit) + ",1)");
    hg.addColorStop(1, "rgba(" + Math.round(238 * lit) + "," + Math.round(224 * lit) + "," + Math.round(204 * lit) + ",1)");
    g.fillStyle = hg;
    g.beginPath();
    g.moveTo(hx - hw, headY - hr * 0.10);
    g.quadraticCurveTo(hx, headY - hr * 2.10, hx + hw, headY - hr * 0.10);
    g.closePath(); g.fill();
    g.beginPath();                                     // つば
    g.moveTo(hx - hw * 1.12, headY - hr * 0.10);
    g.lineTo(hx + hw * 1.12, headY - hr * 0.10);
    g.lineTo(hx + hw * 1.02, headY + hr * 0.06);
    g.lineTo(hx - hw * 1.02, headY + hr * 0.06);
    g.closePath(); g.fill();
  }

  if (isMe){                                           // 自分の席は足元だけうっすら
    const fg = g.createRadialGradient(x, y + U * 0.16, 1, x, y + U * 0.16, U * 0.66);
    fg.addColorStop(0, "rgba(255,180,100,0.20)"); fg.addColorStop(1, "rgba(255,180,100,0)");
    g.fillStyle = fg; g.fillRect(x - U * 0.7, y - U * 0.2, U * 1.4, U * 0.8);
  }
  g.globalAlpha = 1;
}

function drawSteam(now, events){
  for (const e of events.loyly){
    const a = now - (e.t + LOYLY_TELL);        // 蒸気は予兆のあとに降りてくる
    if (a < 0 || a > 7000) continue;
    const k = a / 7000;
    g.globalAlpha = (1 - k) * 0.30;
    for (let i = 0; i < 16; i++){
      const sx = W * unit("s" + e.t + i), sy = -40 + k * H * 1.15 + noise(now / 200 + i * 7) * 60;
      const r = 30 + unit("r" + e.t + i) * 70;
      const grd = g.createRadialGradient(sx, sy, 1, sx, sy, r);
      grd.addColorStop(0, "rgba(255,240,225,0.5)"); grd.addColorStop(1, "rgba(255,240,225,0)");
      g.fillStyle = grd; g.beginPath(); g.arc(sx, sy, r, 0, 6.284); g.fill();
    }
    g.globalAlpha = 1;
    if (a < 800){
      g.fillStyle = "rgba(255,244,232," + (0.42 * (1 - a / 800)).toFixed(3) + ")";
      g.fillRect(0, 0, W, H);
    }
  }
}

/* ---- 操作は3つだけ。すべて画面の下半分 -------------------------------- */

const Btn = {loyly: null, water: null, move: null};

// 表示だけを遅らせて追いつかせる。数値が跳ねても画は跳ねない
const approach = (cur, target, tau, dt) => cur + (target - cur) * (1 - Math.exp(-dt / tau));

// 他人の見た目。心拍は2秒おきなので、そのまま描くと姿勢が段階的に飛ぶ
const Look = new Map();
function lookOf(id, heat, stam, dt){
  let o = Look.get(id);
  if (!o){ o = {heat, stam}; Look.set(id, o); }
  o.heat = approach(o.heat, heat, LOOK_TAU, dt);
  o.stam = approach(o.stam, stam, LOOK_TAU, dt);
  return o;
}

// 呼吸の輪。ふくらみ切った瞬間にタップする。乱れているとふらつく
function drawBreath(now, cy, disturb, hint){
  const phase = Me.bPhase;
  const swell = 0.5 + 0.5 * Math.cos(phase * 6.283);          // 位相0で最大
  const wob = disturb * 5.5 * Math.sin(now / 47) ;            // 乱れ＝目印がぶれる
  const rBase = Math.min(38, W * 0.10);
  const r = rBase * (0.52 + 0.48 * swell) + wob;
  const cx = Math.max(rBase + 12, W * 0.20);          // 炎に重ねない。桶が置いてある側

  // 合わせる位置。目印を4つ置いて「ここまで来たら」を分かるようにする
  g.strokeStyle = "rgba(232,220,208," + (0.20 + disturb * 0.06).toFixed(3) + ")";
  g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, rBase, 0, 6.284); g.stroke();
  g.strokeStyle = "rgba(255,214,160,0.34)"; g.lineWidth = 1.6;
  for (let k = 0; k < 4; k++){
    const a = k * 1.5708 + 0.7854;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * (rBase - 3), cy + Math.sin(a) * (rBase - 3));
    g.lineTo(cx + Math.cos(a) * (rBase + 4), cy + Math.sin(a) * (rBase + 4));
    g.stroke();
  }

  const near = Math.min(phase, 1 - phase) < 0.10;
  g.strokeStyle = near ? "rgba(255,214,150,0.92)" : "rgba(255,170,90,0.42)";
  g.lineWidth = near ? 3 : 2;
  g.beginPath(); g.arc(cx, cy, Math.max(4, r), 0, 6.284); g.stroke();

  if (Me.bFlash > 0){                                          // 整った手応え
    g.strokeStyle = "rgba(255,240,205," + (Me.bFlash * 0.85).toFixed(3) + ")";
    g.lineWidth = 2 + Me.bFlash * 3;
    g.beginPath(); g.arc(cx, cy, rBase + (1 - Me.bFlash) * 26, 0, 6.284); g.stroke();
  }
  if (Me.bMiss > 0){
    g.strokeStyle = "rgba(255,110,70," + (Me.bMiss * 0.55).toFixed(3) + ")";
    g.lineWidth = 2;
    const j = (1 - Me.bMiss) * 8;
    g.beginPath(); g.arc(cx + Math.sin(now / 30) * j, cy, rBase, 0, 6.284); g.stroke();
  }
  // 文字は画面外へ出さない。輪が左端寄りなので中央へ寄せ直す
  const say = (msg, col, a) => {
    g.textAlign = "center"; g.font = "10px sans-serif";
    const half = g.measureText(msg).width / 2 + 6;
    g.globalAlpha = a; g.fillStyle = col;
    g.fillText(msg, clamp(cx, half, W - half), cy - rBase - 13);
    g.globalAlpha = 1;
  };
  if (disturb > 0.35) say("呼吸が乱れている", COL.fire, disturb * 0.6);
  else if (hint) say("輪が重なった瞬間に、どこでも触れる", COL.text, 0.5);  // 最初の1回だけ
}

function drawControls(now, canLoyly, canMove, moveDown, running){
  const pad = Math.max(10, W * 0.03);
  const bw = (W - pad * 4) / 3, bh = Math.max(64, H * 0.085);
  const by = H - bh - Math.max(20, H * 0.045);
  Btn.loyly = {x: pad, y: by, w: bw, h: bh};
  Btn.water = {x: pad * 2 + bw, y: by, w: bw, h: bh};
  Btn.move  = {x: pad * 3 + bw * 2, y: by, w: bw, h: bh};

  // 体力と熱。数字は出さない。色だけに頼らないよう小さく名前を添える
  const gw = W - pad * 2 - 26;
  const gx = pad + 26;
  const stamY = by - 26, heatY = by - 13;
  const st = clamp(Me.dStam / STAM_MAX, 0, 1);       // 表示値。跳ねずに追いつく
  const hot = clamp(Me.dHeat / HEAT_MAX, 0, 1);

  g.textAlign = "left"; g.font = "9px sans-serif"; g.globalAlpha = 0.42; g.fillStyle = COL.text;
  g.fillText("体力", pad, stamY + 7); g.fillText("熱", pad, heatY + 7);
  g.globalAlpha = 1;

  // 整いの度合いは体力バーの縁で見せる（バーを増やさない）
  if (Me.calm > 0.55 && !Me.out){
    g.strokeStyle = "rgba(255,240,205," + ((Me.calm - 0.55) * 1.1).toFixed(3) + ")";
    g.lineWidth = 1.2; rr(gx - 1.5, stamY - 1.5, gw + 3, 10, 5); g.stroke();
  }

  g.fillStyle = "rgba(255,255,255,0.07)"; rr(gx, stamY, gw, 7, 3.5); g.fill();
  const sg = g.createLinearGradient(gx, 0, gx + gw, 0);                 // 減ると赤に寄る
  const low = st < 0.25;
  sg.addColorStop(0, low ? "rgba(255,120,70,0.95)" : "rgba(255,214,160,0.92)");
  sg.addColorStop(1, low ? "rgba(255,80,50,0.95)" : "rgba(255,178,110,0.92)");
  g.fillStyle = sg; rr(gx, stamY, Math.max(4, gw * st), 7, 3.5); g.fill();
  if (low){                                                             // 残り少ないと脈打つ
    g.globalAlpha = 0.25 + 0.25 * Math.sin(now / 130);
    g.fillStyle = "rgba(255,120,70,1)"; rr(gx, stamY, Math.max(4, gw * st), 7, 3.5); g.fill();
    g.globalAlpha = 1;
  }

  g.fillStyle = "rgba(255,255,255,0.055)"; rr(gx, heatY, gw, 4, 2); g.fill();
  const hg = g.createLinearGradient(gx, 0, gx + gw, 0);
  hg.addColorStop(0, "rgba(255,160,60,0.7)"); hg.addColorStop(1, "rgba(255,90,40,0.8)");
  g.fillStyle = hg; rr(gx, heatY, Math.max(3, gw * hot), 4, 2); g.fill();

  // アイコンはすべて自前のベクター（絵文字は使わない）
  const icon = (kind, cx2, cy2, r2, col) => {
    g.strokeStyle = col; g.fillStyle = col;
    g.lineWidth = 1.7; g.lineCap = "round"; g.lineJoin = "round";
    if (kind === "loyly"){                             // ひしゃく＋落ちる滴
      g.beginPath(); g.moveTo(cx2 - r2 * 0.15, cy2 + r2 * 0.15);
      g.lineTo(cx2 + r2 * 0.95, cy2 - r2 * 0.75); g.stroke();
      g.beginPath(); g.ellipse(cx2 - r2 * 0.42, cy2 + r2 * 0.38, r2 * 0.46, r2 * 0.32, 0.35, 0, 6.284); g.fill();
      g.beginPath(); g.arc(cx2 - r2 * 0.95, cy2 - r2 * 0.55, r2 * 0.13, 0, 6.284); g.fill();
    } else if (kind === "water"){                      // 桶
      g.beginPath();
      g.moveTo(cx2 - r2 * 0.78, cy2 - r2 * 0.55); g.lineTo(cx2 + r2 * 0.78, cy2 - r2 * 0.55);
      g.lineTo(cx2 + r2 * 0.58, cy2 + r2 * 0.70); g.lineTo(cx2 - r2 * 0.58, cy2 + r2 * 0.70);
      g.closePath(); g.stroke();
      g.beginPath(); g.moveTo(cx2 - r2 * 0.70, cy2 - r2 * 0.06);
      g.lineTo(cx2 + r2 * 0.70, cy2 - r2 * 0.06); g.stroke();
    } else {                                           // 段の上下（山形）
      const d = kind === "down" ? 1 : -1;
      g.beginPath();
      g.moveTo(cx2 - r2 * 0.62, cy2 - d * r2 * 0.32);
      g.lineTo(cx2, cy2 + d * r2 * 0.34);
      g.lineTo(cx2 + r2 * 0.62, cy2 - d * r2 * 0.32); g.stroke();
      g.globalAlpha *= 0.5;
      g.beginPath();
      g.moveTo(cx2 - r2 * 0.62, cy2 - d * r2 * 0.80);
      g.lineTo(cx2, cy2 - d * r2 * 0.14);
      g.lineTo(cx2 + r2 * 0.62, cy2 - d * r2 * 0.80); g.stroke();
      g.globalAlpha /= 0.5;
    }
    g.lineCap = "butt"; g.lineJoin = "miter";
  };

  const face = (b, on, label, sub, kind) => {
    const bg = g.createLinearGradient(0, b.y, 0, b.y + b.h);
    if (on){ bg.addColorStop(0, "rgba(255,132,34,0.18)"); bg.addColorStop(1, "rgba(255,96,24,0.07)"); }
    else   { bg.addColorStop(0, "rgba(255,255,255,0.045)"); bg.addColorStop(1, "rgba(255,255,255,0.015)"); }
    g.fillStyle = bg; rr(b.x, b.y, b.w, b.h, 12); g.fill();
    g.strokeStyle = on ? "rgba(255,150,60,0.80)" : "rgba(232,220,208,0.13)";
    g.lineWidth = 1.5; rr(b.x, b.y, b.w, b.h, 12); g.stroke();
    if (on){                                           // 押せるものだけ上端が光る
      g.fillStyle = "rgba(255,214,160,0.22)";
      g.fillRect(b.x + 10, b.y + 1, b.w - 20, 1);
    }
    const col = on ? COL.core : "rgba(232,220,208,0.28)";
    const cx2 = b.x + b.w / 2;
    g.globalAlpha = on ? 1 : 0.75;
    icon(kind, cx2, b.y + b.h * 0.30, Math.min(11, b.w * 0.15), col);
    g.globalAlpha = 1;
    g.textAlign = "center"; g.fillStyle = col;
    g.font = Math.min(14, b.w * 0.20).toFixed(0) + "px sans-serif";
    g.fillText(label, cx2, b.y + b.h * 0.70);
    if (sub){
      g.font = "9px sans-serif"; g.globalAlpha = 0.55;
      g.fillText(sub, cx2, b.y + b.h * 0.90); g.globalAlpha = 1;
    }
  };

  // 理由は回が走っているときだけ出す（回の間は「満席」でも「冷えていない」でもない）
  // 理由は回が走っているときだけ出す（回の間は「満席」でも「冷えていない」でもない）
  face(Btn.loyly, canLoyly && !Me.out, "ロウリュ",
       (running && !canLoyly) ? "ストーブが冷えていない" : null, "loyly");
  face(Btn.water, Me.water > 0 && !Me.out, "水", null, "water");
  for (let i = 0; i < WATER_MAX; i++){                 // 桶の残りは点で見せる
    const cx2 = Btn.water.x + Btn.water.w / 2 + (i - (WATER_MAX - 1) / 2) * 11;
    g.beginPath(); g.arc(cx2, Btn.water.y + Btn.water.h * 0.90, 3, 0, 6.284);
    g.fillStyle = i < Me.water ? "rgba(255,208,138,0.85)" : "rgba(232,220,208,0.14)"; g.fill();
  }
  face(Btn.move, canMove && !Me.out, moveDown ? "下がる" : "上がる",
       (running && moveDown && !canMove) ? "下段は満席" : null, moveDown ? "down" : "up");
}

function drawTop(aliveCount, temp, rs, hell){
  g.textAlign = "left"; g.font = "13px sans-serif";
  g.fillStyle = COL.text; g.globalAlpha = 0.72;
  g.fillText("残り " + aliveCount + "人", 16, 30);
  g.textAlign = "right";
  g.globalAlpha = hell > 0.5 ? 0.95 : 0.72;
  g.fillStyle = hell > 0.5 ? COL.fire : COL.text;
  g.fillText(temp.toFixed(1) + "℃", W - 16, 30);
  g.globalAlpha = 1;
  if (rs.running){                                    // 回の残り時間は線だけ（数字を主役にしない）
    g.fillStyle = "rgba(255,140,50,0.30)";
    g.fillRect(0, 0, W * (rs.left / ROUND_MS), 2.5);
  }
}

/* ---- 本体 -------------------------------------------------------------- */

const App = {
  screen: "door",
  events: {loyly: [], door: []},
  prev: null, seenLoyly: {}, doorGlow: 0,
  pressedAt: 0,                    // 部屋で最後にひしゃくが動いた時刻（予兆の開始）
  roomLoyly: 0,                    // 蒸気が実際に降りた時刻
  banner: null,                    // {text, until}
  wasAlive: true,

  enter(){
    Audio_.start();
    const open = isOpen(serverNow());
    this.screen = open ? "sauna" : "locker";
    Audio_.door(); this.doorGlow = 1;
    Me.reset(roundState(serverNow()).idx);
    Net.join();
  },

  tap(x, y){
    if (this.screen === "door") return this.enter();
    if (this.screen !== "sauna" || Me.out) return;
    const rs = roundState(serverNow());
    if (!rs.running) return;
    const now = serverNow();
    const hit = b => b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

    if (hit(Btn.loyly)){
      if (Seats.tierOf(me) === Seats.tiers - 1) return;              // 下段からは手が届かない
      if (now - this.pressedAt < LOYLY_ROOM) return;                 // ストーブが冷えていない
      if (now - Me.lastLoyly < LOYLY_SELF) return;
      Me.lastLoyly = now; Net.sendLoyly(); return;
    }
    if (hit(Btn.water)){
      if (Me.water <= 0) return;
      Me.water--; Me.heat = Math.max(0, Me.heat + WATER_COOL);
      Audio_.water(); Net.push(); return;
    }
    if (hit(Btn.move)){
      const last = Seats.tiers - 1, cur = Seats.tierOf(me);
      const want = cur < last ? cur + 1 : cur - 1;
      if (want < 0) return;
      Me.tier = want; Audio_.move(); Net.push(); return;
    }
    this.breathe(now);                       // ボタン以外はどこでも呼吸
  },

  digest(people, now){
    const ids = new Set(people.map(p => p.id));
    if (this.prev && Net.seen){
      let ch = 0;
      for (const id of ids) if (!this.prev.has(id)) ch++;
      for (const id of this.prev) if (!ids.has(id)) ch++;
      if (ch > 0){ this.events.door.push({t: now}); if (this.screen === "sauna"){ Audio_.door(); this.doorGlow = 1; } }
    }
    this.prev = ids;

    // 新しいロウリュ。押された時点では効かない。まず予兆の音だけ鳴る
    for (const k in Net.loyly){
      const e = Net.loyly[k];
      if (!e || typeof e.t !== "number" || this.seenLoyly[k]) continue;
      this.seenLoyly[k] = 1;
      if (e.t > this.pressedAt) this.pressedAt = e.t;
      if (now - e.t < 8000){
        this.events.loyly.push({t: e.t, applied: false});
        if (this.screen === "sauna" && now - e.t < LOYLY_TELL) Audio_.hiss();
      }
    }
    // 予兆が切れた瞬間に降りてくる。ここで熱が乗り、呼吸が飛ぶ
    for (const e of this.events.loyly){
      if (e.applied || now < e.t + LOYLY_TELL) continue;
      e.applied = true;
      this.roomLoyly = e.t + LOYLY_TELL;
      if (this.screen === "sauna"){
        Audio_.loyly();
        if (!Me.out){
          const bite = loylyBite(Seats.tierOf(me), Seats.tiers);      // 上段ほど効く
          Me.surge += LOYLY_HEAT * bite;                              // 一気に乗せず、じんわり流し込む
          Me.bPhase = (Me.bPhase + 0.3 + 0.35 * unit("d" + e.t)) % 1; // 呼吸が飛ぶ＝合わせ直し
          Me.bJudged = -1;
        }
      }
    }
    this.events.loyly = this.events.loyly.filter(e => now - e.t < 30000);
    this.events.door = this.events.door.filter(e => now - e.t < 9000);
  },

  disturb(now){ return clamp(1 - (now - this.roomLoyly) / DISTURB_MS, 0, 1); },

  // 呼吸・熱・体力の進行。自分のぶんだけ計算し、心拍で他人に伝える
  tick(now, dt, rs){
    if (!rs.running || Me.out) return;
    const tier = Seats.tierOf(me), tiers = Seats.tiers;

    // 呼吸を進める。1周期を放置したら整いが落ちる＝手を止めていられない
    const per = breathPeriod(tier, tiers, this.disturb(now));
    Me.bPhase += dt / per;
    while (Me.bPhase >= 1){
      Me.bPhase -= 1; Me.bCycle++;
      if (Me.bJudged < Me.bCycle - 1) Me.calm = clamp(Me.calm - CALM_LAPSE, 0, 1);
    }
    Me.bFlash = Math.max(0, Me.bFlash - dt * 3.2);
    Me.bMiss  = Math.max(0, Me.bMiss  - dt * 3.2);

    const eq = heatEquilibrium(tier, tiers, now - this.roomLoyly < 8000);
    Me.heat = clamp(Me.heat + (eq - Me.heat) * HEAT_K * dt, 0, HEAT_MAX);
    if (Me.surge > 0.01){                                // ロウリュぶんを少しずつ流し込む
      const add = Me.surge * (1 - Math.exp(-dt / SURGE_TAU));
      Me.surge -= add;
      Me.heat = clamp(Me.heat + add, 0, HEAT_MAX);
    } else Me.surge = 0;
    Me.stam = Math.max(0, Me.stam - drainRate(Me.heat, Me.calm) * dt);
    if (Me.stam <= 0){
      Me.out = true; Audio_.out();
      this.banner = {text: "のぼせた", until: now + 2200};
      Net.push();
    }
  },

  // 呼吸のタップ。ふくらみ切った瞬間（位相0付近）で整う
  breathe(now){
    const d = Math.min(Me.bPhase, 1 - Me.bPhase);            // 位相0からの距離
    const per = breathPeriod(Seats.tierOf(me), Seats.tiers, this.disturb(now));
    const offMs = d * per * 1000;
    const cycle = Me.bPhase > 0.5 ? Me.bCycle + 1 : Me.bCycle;
    if (Me.bJudged === cycle) return;                        // 1周期に1回だけ
    Me.bJudged = cycle;
    if (offMs <= BREATH_HIT){
      Me.calm = clamp(Me.calm + CALM_GAIN, 0, 1);
      Me.bFlash = 1; Audio_.breathIn();
    } else {
      Me.calm = clamp(Me.calm - CALM_MISS, 0, 1);
      Me.bMiss = 1; Audio_.breathOff();
    }
  },

  fidget(people, now){
    if (this.screen !== "sauna") return;
    const b = Math.floor(now / 1000);
    for (const p of people)
      if (!p.out && hash32(p.id + ":" + b) % 11 === 0){ Audio_.cloth(now); break; }
  },

  last: 0,
  frame(){
    const now = serverNow();
    const dt = this.last ? Math.min(0.25, (now - this.last) / 1000) : 0;
    this.last = now;
    this.doorGlow = Math.max(0, this.doorGlow - 0.028);

    if (this.screen === "locker" && isOpen(now)){ this.screen = "sauna"; Audio_.door(); this.doorGlow = 1; Me.reset(roundState(now).idx); }
    if (this.screen === "sauna" && !isOpen(now)) this.screen = "locker";
    if (this.screen === "door") return this.drawDoorScreen(now);

    const all = Net.present();
    if (this.screen === "locker") return this.drawLocker(all, now);

    const rs = roundState(now);
    const here = all.filter(p => p.s === "i");
    if (rs.idx !== Me.round){                                 // 回が変わったら全員やり直し
      const wasOut = Me.out;
      if (Me.round >= 0){ Me.played++; if (!wasOut) Me.survived++; }
      Me.reset(rs.idx); Net.push();
      if (wasOut) this.banner = {text: "つぎの回", until: now + 1500};
    }
    // 他人は publish された値を使う。回が古い人はまだ前の回の値なので生存扱いにしない
    const inRound = here.map(p => Object.assign({}, p, {out: p.out || p.r !== rs.idx && p.out}));
    const alive = inRound.filter(p => !p.out);

    this.digest(here, now);
    this.fidget(here, now);
    this.tick(now, dt, rs);
    Me.dHeat = approach(Me.dHeat, Me.heat, BAR_TAU_H, dt);   // 見た目を実値へじんわり寄せる
    Me.dStam = approach(Me.dStam, Me.stam, BAR_TAU_S, dt);
    if (Look.size > 200) Look.clear();

    if (rs.running && alive.length === 1 && here.length > 1 && this.wasAlive){
      if (alive[0].id === me){ Audio_.win(); this.banner = {text: "ととのった", until: now + 3000}; }
      this.wasAlive = false;
    }
    if (!rs.running) this.wasAlive = true;

    const temp = temperature(alive.length, now, this.events);
    const hell = clamp((temp - 90) / 14, 0, 1);
    Flick = flickerOf(now);                                    // 炎のゆらぎ。部屋全体がこれに従う

    // 予兆の進行。誰かが打った直後だけ 0→1 になる
    const sinceP = now - this.pressedAt;
    const tell = (sinceP >= 0 && sinceP < LOYLY_TELL) ? sinceP / LOYLY_TELL : 0;
    const stoveReady = rs.running && sinceP >= LOYLY_ROOM;

    drawRoom(this.doorGlow);
    drawStove(now, hell, stoveReady, tell);

    Seats.ensure(alive.length);
    Seats.assign(inRound);

    for (const gh of Seats.ghosts){
      const s = Seats.list[gh.seat]; if (!s) continue;
      drawPerson(s.x, s.y, s.s, gh.id, (1 - (performance.now() - gh.t) / SEAT_FADE) * 0.5, false, 0, false);
    }
    // ロウリュが降りた直後のすくみ。段ごとに大きさが違う＝誰に当たったかが見える
    const recoil = clamp(1 - (now - this.roomLoyly) / 480, 0, 1);
    // 奥の段から描き、段ごとに空気の膜をかぶせる＝距離が出る
    for (let r = 0; r < Seats.tiers; r++){
      for (const p of alive){
        const s = Seats.list[Seats.map[p.id]];
        if (!s || s.tier !== r) continue;
        const mine = p.id === me;
        const lk = mine ? {heat: Me.dHeat, stam: Me.dStam} : lookOf(p.id, p.heat, p.stam, dt);
        drawPerson(s.x, s.y, s.s, p.id, 1, mine, lk.heat, false, lk.stam,
                   recoil * (loylyBite(s.tier, Seats.tiers) / 1.8));
      }
      const remain = Seats.tiers <= 1 ? 0 : 1 - r / (Seats.tiers - 1);
      if (remain > 0.01){
        const yTop = Seats.tierY[r] - H * 0.10, yBot = Seats.tierY[r] + H * 0.06;
        const veil = g.createLinearGradient(0, yTop, 0, yBot);
        const a = (0.10 * remain).toFixed(3);
        veil.addColorStop(0, "rgba(46,28,18," + a + ")");
        veil.addColorStop(1, "rgba(46,28,18," + (0.16 * remain).toFixed(3) + ")");
        g.fillStyle = veil; g.fillRect(0, yTop, W, yBot - yTop);
      }
    }
    // 出された人は床に座り込んで見ている（部屋から消えない＝人が減らない）
    const outs = inRound.filter(p => p.out);
    for (let i = 0; i < outs.length; i++){
      const x = W * (0.10 + 0.80 * (outs.length === 1 ? 0.5 : i / (outs.length - 1)));
      drawPerson(x, H * 0.655, 0.70, outs[i].id, 0.42, outs[i].id === me, HEAT_MAX, true, 0);
    }

    drawSteam(now, this.events);
    if (hell > 0){
      g.globalAlpha = hell * 0.16; g.fillStyle = COL.fire;
      const wob = Math.sin(now / 90) * 2;
      for (let i = 0; i < 5; i++) g.fillRect(0, H * (0.3 + i * 0.14) + wob, W, 1.5);
      g.globalAlpha = 1;
    }

    const canLoyly = rs.running && now - this.pressedAt >= LOYLY_ROOM
                     && now - Me.lastLoyly >= LOYLY_SELF && Seats.tierOf(me) !== Seats.tiers - 1;
    const cur = Seats.tierOf(me), last = Seats.tiers - 1;
    const moveDown = cur < last;
    const canMove = rs.running && (moveDown ? Seats.freeIn(cur + 1, inRound) : true);
    drawHaze(now, hell);                                       // 熱気と陽炎
    drawVignette(hell);                                        // 人と炎の上に重ねて中央へ寄せる
    drawGrain(now);                                            // フィルムの粒子
    if (rs.running && !Me.out)
      drawBreath(now, H * 0.705, this.disturb(now),
                 Me.played === 0 && rs.left > ROUND_MS - 12000);
    drawTop(alive.length, temp, rs, hell);
    drawControls(now, canLoyly, canMove, moveDown, rs.running);

    if (!rs.running){                                          // 回の間
      g.fillStyle = "rgba(8,6,5,0.55)"; g.fillRect(0, 0, W, H);
      g.textAlign = "center"; g.fillStyle = COL.text;
      g.globalAlpha = 0.9; g.font = "18px sans-serif";
      g.fillText("つぎの回は " + Math.ceil(rs.toNext / 1000) + "秒後", W / 2, H * 0.44);
      g.globalAlpha = 0.45; g.font = "12px sans-serif";
      g.fillText("いま " + here.length + "人", W / 2, H * 0.44 + 26);
      if (Me.played > 0){                                      // 今夜の記録だけ。保存も順位も作らない
        g.globalAlpha = 0.62; g.font = "13px sans-serif"; g.fillStyle = COL.core;
        g.fillText("今夜 " + Me.played + "回中 " + Me.survived + "回のこった", W / 2, H * 0.44 + 54);
      }
      g.globalAlpha = 1;
    }
    if (this.banner && now < this.banner.until){
      const k = 1 - (this.banner.until - now) / 3000;
      g.textAlign = "center"; g.globalAlpha = clamp(1.6 - Math.abs(k - 0.3) * 2.4, 0, 1);
      g.fillStyle = COL.core; g.font = "26px sans-serif";
      g.fillText(this.banner.text, W / 2, H * 0.24);
      g.globalAlpha = 1;
    }
  },

  drawDoorScreen(now){
    g.fillStyle = COL.bg; g.fillRect(0, 0, W, H);
    const w = Math.min(190, W * 0.52), h = Math.min(300, H * 0.44);
    const x = (W - w) / 2, y = (H - h) / 2 - 14;
    const glow = g.createRadialGradient(x + w, y + h / 2, 2, x + w, y + h / 2, w * 1.5);
    glow.addColorStop(0, "rgba(255,150,60,0.17)"); glow.addColorStop(1, "rgba(255,150,60,0)");
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    g.fillStyle = "#1a110c"; rr(x, y, w, h, 6); g.fill();
    g.strokeStyle = "rgba(255,190,130,0.12)"; g.lineWidth = 1; rr(x + 9, y + 9, w - 18, h - 18, 4); g.stroke();
    g.fillStyle = "rgba(255,190,130,0.16)"; rr(x + w - 20, y + h / 2 - 13, 4, 26, 2); g.fill();
    const p = 0.5 + Math.sin(now / 900) * 0.28;
    g.fillStyle = "rgba(255,190,120," + (0.18 + p * 0.4).toFixed(3) + ")";
    g.fillRect(x + w - 3, y + 6, 3, h - 12);
    g.fillStyle = COL.text; g.globalAlpha = 0.5; g.textAlign = "center"; g.font = "13px sans-serif";
    g.fillText("ふれて入る", W / 2, y + h + 40); g.globalAlpha = 1;
  },

  drawLocker(all, now){
    const grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, "#0a0806"); grd.addColorStop(1, "#141010");
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    const by = H * 0.60;
    g.fillStyle = COL.wood; rr(-10, by, W + 20, H * 0.03, 3); g.fill();
    const wait = all.slice(0, 9);
    for (let i = 0; i < wait.length; i++){
      const n = wait.length, x = n === 1 ? W / 2 : W * 0.14 + (W * 0.72) * (i / (n - 1));
      drawPerson(x, by, 0.92, wait[i].id, 0.55, wait[i].id === me, 0, false);
    }
    const at = nextOpenAt(now), left = Math.max(0, at - now);
    const mm = String(Math.floor(left / 60000)).padStart(2, "0");
    const ss = String(Math.floor(left / 1000) % 60).padStart(2, "0");
    g.textAlign = "center"; g.fillStyle = COL.text;
    g.globalAlpha = 0.9; g.font = "19px sans-serif"; g.fillText("次は " + clockLabel(at) + " に開きます", W / 2, H * 0.30);
    g.globalAlpha = 0.55; g.font = "13px sans-serif"; g.fillText("いま " + all.length + "人が待っています", W / 2, H * 0.30 + 30);
    g.globalAlpha = 0.32; g.font = "30px sans-serif"; g.fillText(mm + ":" + ss, W / 2, H * 0.30 + 78);
    g.globalAlpha = 1;
  }
};

cv.addEventListener("pointerdown", e => { e.preventDefault(); App.tap(e.clientX, e.clientY); });

resize();
(function loop(){ App.frame(); requestAnimationFrame(loop); })();
</script>
