<canvas id="c"></canvas>
<script>
/* =========================================================================
   とおいサウナ — バトル版
   誰が一番長く入っていられるか。喋らない。ロウリュで他人を熱くできる。
   居心地版（何も達成しない版）は index-居心地版.html に置いてある
   ========================================================================= */

/* ---- 設定 ------------------------------------------------------------- */

// Firebase Realtime Database の URL。空のままだと「ひとり」で動く（体感の確認用）
const DB = "";

// 装備はMVPに入れない。コア（熱・3つの逃がし方・ロウリュ）が面白いかを先に確かめる
const EQUIPMENT = false;

const Q = new URLSearchParams(location.search);
const ROOM        = (Q.get("room") || "main").replace(/[^a-zA-Z0-9_-]/g, "");
const ALWAYS_OPEN = Q.get("open") === "1";        // 開場時刻を待たずに入る（動作確認用）
const FAST        = Q.get("fast") === "1";        // 1回20秒。手触りを確かめるとき3分待たずに済む
const OPEN_FROM   = [0, 30];                      // 毎時00分と30分から
const OPEN_LEN    = 15;                           // 15分ぶん開く
const ROUND_MS    = FAST ? 20000 : 180000;        // 1回は最長3分
const GAP_MS      = FAST ? 6000 : 40000;          // 回と回の間は40秒（脱落者はここで戻る）
const HB_MS       = 2000;
const STALE_MS    = 7000;
const SEAT_FADE   = 2000;

// 熱と体力の設計。ここだけ触れば手触りは変えられる
//   熱   … いまどれだけ熱いか。段ごとの落ち着き先へ向かって上下する（水で下がる）
//   体力 … 熱が高いほど速く減る。戻らない。0で出される
//   ＝水は「延命」であって「解除」ではない。回に必ず終わりと山ができる
const HEAT_MAX    = 100;
const HEAT_K      = FAST ? 0.16 : 0.045;          // 落ち着き先へ近づく速さ（毎秒）
const HEAT_DROP   = 58;                           // 上段と下段の落ち着き先の差
const STAM_MAX    = 100;
const STAM_BASE   = STAM_MAX / (FAST ? 22 : 120); // 体力の減り。熱で倍率がかかる
const WATER_MAX   = 3;                            // 桶は3杯
const WATER_COOL  = -26;                          // 1杯で下がる熱
const LOYLY_HEAT  = 18;                           // 全員に乗る熱（押した人にも乗る）
const LOYLY_AFTER = 15;                           // 降りてから8秒は部屋そのものが熱い
const LOYLY_ROOM  = FAST ? 4000 : 20000;          // ストーブが冷えるまで部屋の誰も打てない
const LOYLY_SELF  = FAST ? 6000 : 40000;          // 1人あたりの間隔
// 予兆。押した瞬間には効かない。ひしゃくの音がしてから降りてくるまでの猶予
// 「他人が急に打つのでタイミングが分からない」を、ここで反応の勝負に変えている
const LOYLY_TELL  = 1800;

/* ---- 決定的な乱数とノイズ --------------------------------------------- */

function hash32(s){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  h ^= h >>> 13; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 16;
  return h >>> 0;
}
const unit = s => hash32(s) / 4294967296;
function ihash(i){ let h = Math.imul(i ^ 0x9e3779b9, 2654435761) >>> 0; h ^= h >>> 15; return (h >>> 0) / 4294967296; }
const smooth = t => t * t * (3 - 2 * t);
function noise(x){
  const i = Math.floor(x), f = x - i;
  return ihash(i) + (ihash(i + 1) - ihash(i)) * smooth(f);
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---- 時刻（サーバー基準。炎も回の進行も全員で一致させる）-------------- */

let clockOffset = 0;
const serverNow = () => Date.now() + clockOffset;
const frameOf   = t => Math.floor(t / 33);

function jstMinuteOfHour(t){ return Math.floor((t + 9 * 3600e3) / 60000) % 60; }
function isOpen(t){
  if (ALWAYS_OPEN) return true;
  const m = jstMinuteOfHour(t);
  return OPEN_FROM.some(s => m >= s && m < s + OPEN_LEN);
}
function openedAt(t){                              // いまの開場が始まった時刻
  if (ALWAYS_OPEN) return 0;                       // 動作確認用。回が延々と切り替わり続ける
  const m = jstMinuteOfHour(t);
  const hourStart = t - m * 60000 - ((t + 9 * 3600e3) % 60000);
  let best = hourStart + OPEN_FROM[0] * 60000;
  for (const s of OPEN_FROM){ const c = hourStart + s * 60000; if (c <= t && c > best) best = c; }
  return best;
}
function nextOpenAt(t){
  const m = jstMinuteOfHour(t);
  const hourStart = t - m * 60000 - ((t + 9 * 3600e3) % 60000);
  for (const s of OPEN_FROM) if (m < s) return hourStart + s * 60000;
  return hourStart + 60 * 60000 + OPEN_FROM[0] * 60000;
}
function clockLabel(t){
  const j = new Date(t + 9 * 3600e3);
  return String(j.getUTCHours()).padStart(2, "0") + ":" + String(j.getUTCMinutes()).padStart(2, "0");
}

// 回（ラウンド）の進行。開場時刻からの経過だけで決まるので通信は要らない
function roundState(t){
  const from = openedAt(t), el = t - from, cyc = ROUND_MS + GAP_MS;
  const idx = Math.floor(el / cyc), into = el % cyc;
  const running = into < ROUND_MS;
  return {
    idx, running,
    startedAt: from + idx * cyc,
    left: running ? ROUND_MS - into : 0,
    toNext: running ? 0 : cyc - into
  };
}

/* ---- 音 ---------------------------------------------------------------- */

const Audio_ = {
  ctx: null, master: null, noiseBuf: null, stoveGain: null, lastCloth: 0,
  start(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);

    const n = this.ctx.sampleRate * 2;
    this.noiseBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++){ const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }

    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 240;
    this.stoveGain = this.ctx.createGain(); this.stoveGain.gain.value = 0.10;
    src.connect(lp).connect(this.stoveGain).connect(this.master); src.start();
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = 0.13;
    const lg = this.ctx.createGain(); lg.gain.value = 0.035;
    lfo.connect(lg).connect(this.stoveGain.gain); lfo.start();
  },
  burst({dur = 0.3, type = "bandpass", f0 = 1200, f1 = 1200, q = 1, vol = 0.2, delay = 0}){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t + dur);
    const gn = this.ctx.createGain();
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(vol, t + Math.min(0.05, dur * 0.2));
    gn.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f).connect(gn).connect(this.master);
    s.start(t); s.stop(t + dur + 0.05);
  },
  tone(f0, f1, dur, vol, type = "sine"){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const gn = this.ctx.createGain();
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn).connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  door(){ this.tone(96, 42, 0.24, 0.3); this.burst({dur:.5, f0:1500, f1:300, q:.7, vol:.16}); },
  hiss(){ this.burst({dur:0.5, f0:5200, f1:2600, q:.8, vol:.10}); },   // ロウリュの予兆
  loyly(){
    this.burst({dur:1.9, f0:7000, f1:900, q:.6, vol:.34});
    this.burst({dur:2.4, f0:400, f1:140, q:.8, vol:.14, delay:.05});
    this.tone(90, 40, 0.3, 0.14);
  },
  water(){ this.burst({dur:.7, f0:2400, f1:600, q:.9, vol:.22}); },
  move(){ this.burst({dur:.22, f0:900, f1:400, q:1.2, vol:.10}); },
  out(){ this.tone(320, 90, 0.5, 0.18, "triangle"); this.burst({dur:.8, f0:1800, f1:400, q:.7, vol:.14}); },
  win(){ this.tone(420, 640, 0.5, 0.16, "sine"); this.tone(640, 880, 0.45, 0.10, "sine"); },
  cloth(t){
    if (t - this.lastCloth < 1100) return;
    this.lastCloth = t;
    this.burst({dur:.18, f0:2600, f1:1400, q:1.4, vol:.055});
  }
};

/* ---- 通信 -------------------------------------------------------------- */

const me = (() => {
  let v = sessionStorage.getItem("tsid");
  if (!v){ v = Math.random().toString(36).slice(2, 10); sessionStorage.setItem("tsid", v); }
  return v;
})();

const Net = {
  live: !!DB, joined: false,
  members: {},                  // id -> {t,j,s,tier,heat,out,r}
  loyly: {},                    // key -> {t}
  seen: false,
  url(p){ return DB.replace(/\/+$/, "") + "/rooms/" + ROOM + p; },

  mine(){ return {t: {".sv": "timestamp"}, s: App.screen === "sauna" ? "i" : "w",
                  tier: Me.tier, heat: Math.round(Me.heat), st: Math.round(Me.stam),
                  out: Me.out ? 1 : 0, r: Me.round}; },

  async join(){
    if (!this.live){
      const n = serverNow();
      this.members[me] = {t: n, j: n, s: "i", tier: Me.tier, heat: 0, out: 0, r: Me.round};
      this.joined = true; this.seen = true; return;
    }
    const t0 = Date.now();
    try {
      const body = Object.assign(this.mine(), {j: {".sv": "timestamp"}});
      const r = await fetch(this.url("/m/" + me + ".json"), {method: "PUT", body: JSON.stringify(body)});
      const got = await r.json();
      if (got && typeof got.j === "number") clockOffset = got.j - (t0 + (Date.now() - t0) / 2);
      this.joined = true; this.stream(); this.beat();
    } catch(e){ this.live = false; this.join(); }
  },

  stream(){
    const es = new EventSource(this.url(".json"));
    const apply = (path, data) => {
      const seg = path.split("/").filter(Boolean);
      if (!seg.length){ this.members = (data && data.m) || {}; this.loyly = (data && data.l) || {}; }
      else if (seg[0] === "m"){
        if (seg.length === 1) this.members = data || {};
        else if (data === null) delete this.members[seg[1]];
        else this.members[seg[1]] = Object.assign(this.members[seg[1]] || {}, data);
      } else if (seg[0] === "l"){
        if (seg.length === 1) this.loyly = data || {};
        else if (data === null) delete this.loyly[seg[1]];
        else this.loyly[seg[1]] = data;
      }
      this.seen = true;
    };
    es.addEventListener("put",   e => { const d = JSON.parse(e.data); apply(d.path, d.data); });
    es.addEventListener("patch", e => {
      const d = JSON.parse(e.data);
      for (const k in d.data) apply((d.path === "/" ? "" : d.path) + "/" + k, d.data[k]);
    });
    es.onerror = () => {};
  },

  push(){                        // 動いたら即座に伝える（心拍を待たない）
    if (!this.live){ Object.assign(this.members[me] || {}, {tier: Me.tier, heat: Math.round(Me.heat), out: Me.out ? 1 : 0, r: Me.round, t: serverNow()}); return; }
    fetch(this.url("/m/" + me + ".json"), {method: "PATCH", body: JSON.stringify(this.mine())}).catch(() => {});
  },
  beat(){ setInterval(() => { if (this.live){ this.push(); this.sweep(); } }, HB_MS); },
  sweep(){
    const now = serverNow();
    for (const k in this.loyly)
      if (now - (this.loyly[k].t || 0) > 120000)
        fetch(this.url("/l/" + k + ".json"), {method: "DELETE"}).catch(() => {});
  },
  sendLoyly(){
    if (!this.live){ this.loyly["x" + Math.random().toString(36).slice(2)] = {t: serverNow()}; return; }
    fetch(this.url("/l.json"), {method: "POST", body: JSON.stringify({t: {".sv": "timestamp"}})}).catch(() => {});
  },
  leave(){
    if (!this.live || !this.joined) return;
    try { fetch(this.url("/m/" + me + ".json"), {method: "DELETE", keepalive: true}); } catch(e){}
  },
  present(){
    const now = serverNow(), out = [];
    for (const id in this.members){
      const m = this.members[id];
      if (!m || typeof m.t !== "number" || now - m.t > STALE_MS) continue;
      out.push({id, j: m.j || m.t, s: m.s || "i", tier: m.tier | 0,
                heat: clamp(m.heat | 0, 0, HEAT_MAX),
                stam: clamp(typeof m.st === "number" ? m.st : STAM_MAX, 0, STAM_MAX),
                out: !!m.out, r: m.r | 0});
    }
    return out.sort((a, b) => a.id < b.id ? -1 : 1);
  }
};
addEventListener("pagehide", () => Net.leave());
addEventListener("beforeunload", () => Net.leave());

/* ---- 自分の状態 -------------------------------------------------------- */

const Me = {
  tier: 1, heat: 0, stam: STAM_MAX, water: WATER_MAX, out: false, round: -1, lastLoyly: 0,
  reset(r){
    this.round = r; this.heat = 0; this.stam = STAM_MAX;
    this.water = WATER_MAX; this.out = false;
    this.tier = Math.min(1, Math.max(0, Seats.tiers - 1));
    this.lastLoyly = 0;
  }
};

/* ---- 席（段ごと。下段は席が少ないので取り合いになる）------------------ */

const Seats = {
  list: [], byTier: [], map: {}, ghosts: [], tierY: [], benchH: 0, cap: 0, tiers: 3, want: 20,
  build(W, H, need){
    // 必要席数(want)を覚えておく。cap を need に流し込むと画面を回すたび部屋が増築されてしまう
    need = this.want = Math.max(20, need | 0);
    // 段ごとの重み（上段が広く、下段が狭い）。この重みで need をちょうど超えるまで広げる
    const weights = t => Array.from({length: t}, (_, r) => t <= 1 ? 1 : 1 - (r / (t - 1)) * 0.75);
    const seatsFor = (t, base) => weights(t).reduce((a, w) => a + Math.max(1, Math.round(base * w)), 0);
    let tiers = 3, p = 4;
    for (;;){
      const wsum = weights(tiers).reduce((a, b) => a + b, 0);
      p = Math.max(4, Math.ceil(need / wsum));
      while (seatsFor(tiers, p) < need) p++;                // 誰も席から漏れないようにする
      if (p <= 11 || tiers >= 5) break;
      tiers++;
    }
    this.tiers = tiers; this.list = []; this.tierY = []; this.byTier = [];
    this.benchH = H * 0.024;
    const TOP = 0.30, BOT = 0.60;
    for (let r = 0; r < tiers; r++){
      const y = H * (tiers === 1 ? (TOP + BOT) / 2 : TOP + (BOT - TOP) * (r / (tiers - 1)));
      this.tierY.push(y); this.byTier.push([]);
      // 涼しい段ほど席を絞る（下段は全体の1〜2割）。ここが取り合いになる
      const wq = tiers <= 1 ? 1 : 1 - (r / (tiers - 1)) * 0.75;
      const n = Math.max(1, Math.round(p * wq));
      const inset = W * (0.085 + (tiers - 1 - r) * 0.028);
      const span = Math.max(40, W - inset * 2);
      const spacing = n > 1 ? span / (n - 1) : span;
      const dens = Math.min(1, spacing / 38);
      const depth = tiers === 1 ? 1 : r / (tiers - 1);
      const s = (0.74 + depth * 0.26) * Math.max(0.62, dens);
      for (let i = 0; i < n; i++){
        const x = n === 1 ? W / 2 : inset + span * (i / (n - 1));
        this.byTier[r].push(this.list.length);
        this.list.push({x, y, s, tier: r});
      }
    }
    this.cap = this.list.length;
  },
  ensure(n){ if (n > this.cap) this.build(W, H, n + 6); },

  // 希望の段に空きが無ければ、より熱い段へ回される。全端末で同じ結果になるよう id 順に決める
  assign(people){
    const taken = {}, next = {};
    for (const p of people){
      if (p.out) continue;
      const want = clamp(p.tier, 0, this.tiers - 1);
      let placed = -1;
      for (let d = 0; d < this.tiers && placed < 0; d++){
        for (const cand of [want + d, want - d]){        // 空いてなければ上段（熱い方）優先で寄せる
          if (cand < 0 || cand >= this.tiers) continue;
          const row = this.byTier[cand], L = row.length;
          let k = hash32(p.id) % L;
          for (let i = 0; i < L; i++){
            const idx = row[(k + i) % L];
            if (!taken[idx]){ taken[idx] = p.id; placed = idx; break; }
          }
          if (placed >= 0) break;
        }
      }
      if (placed >= 0) next[p.id] = placed;
    }
    for (const id in this.map)
      if (!(id in next) && this.list[this.map[id]])
        this.ghosts.push({seat: this.map[id], id, t: performance.now()});
    this.map = next;
    this.ghosts = this.ghosts.filter(gh => performance.now() - gh.t < SEAT_FADE && !(gh.id in next));
  },
  tierOf(id){ const s = this.list[this.map[id]]; return s ? s.tier : -1; },
  freeIn(tier, people){                                   // その段に空きがあるか（ボタンの可否用）
    const row = this.byTier[tier] || [];
    let used = 0;
    for (const p of people) if (!p.out && Seats.tierOf(p.id) === tier) used++;
    return used < row.length;
  }
};

/* ---- 部屋の温度（見た目と地獄の演出に使う）---------------------------- */

// 段ごとの熱の落ち着き先。上段ほど熱い
function heatEquilibrium(tier, tiers, loylyRecent){
  const t = tier < 0 ? 1 : tier;
  const d = tiers <= 1 ? 0 : (t / (tiers - 1)) * HEAT_DROP;
  return clamp(HEAT_MAX - d + (loylyRecent ? LOYLY_AFTER : 0), 0, HEAT_MAX + LOYLY_AFTER);
}
// 体力の減り。熱いほど速い。下段で凌ぎ切れるかは紙一重に置いてある
function drainRate(heat){
  const h = clamp(heat / HEAT_MAX, 0, 1);
  return STAM_BASE * (0.35 + 1.15 * Math.pow(h, 1.5));
}

function temperature(alive, now, events){
  let t = 78 + 0.35 * alive;
  for (const e of events.loyly){ const a = now - e.t; if (a >= 0 && a < 30000) t += 3.0 * Math.exp(-a / 13000); }
  for (const e of events.door){ const a = now - e.t; if (a >= 0 && a < 9000) t -= 0.5 * (1 - a / 9000); }
  return clamp(t, 68, 112);
}

/* ---- 描画 -------------------------------------------------------------- */

const cv = document.getElementById("c"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  Seats.build(W, H, Seats.want || 20);
}
addEventListener("resize", resize);

const COL = { bg:"#0d0906", wood:"#241812", wood2:"#2c1d15", body:"#120e0b", text:"#e8dcd0", fire:"#ff7a1a", core:"#ffd08a" };

function rr(x, y, w, h, r){
  g.beginPath();
  r = Math.min(r, w / 2, h / 2);
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function drawRoom(doorGlow){
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, "#080605"); grd.addColorStop(0.42, "#150e0a"); grd.addColorStop(1, "#241710");
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  const ceil = H * 0.075;
  g.fillStyle = "rgba(0,0,0,0.35)"; g.fillRect(0, 0, W, ceil);
  g.strokeStyle = "rgba(255,180,120,0.05)"; g.lineWidth = 1;
  for (let x = 0; x < W; x += 34){ g.beginPath(); g.moveTo(x + 0.5, ceil); g.lineTo(x + 0.5, H * 0.70); g.stroke(); }

  const dw = Math.min(60, W * 0.145), dh = H * 0.165, dx = W * 0.05, dy = H * 0.10;
  g.fillStyle = "#150e0a"; rr(dx, dy, dw, dh, 3); g.fill();
  g.strokeStyle = "rgba(255,190,130,0.10)"; rr(dx + 4, dy + 4, dw - 8, dh - 8, 2); g.stroke();
  const seam = 0.07 + doorGlow * 0.62;
  g.fillStyle = "rgba(200,225,255," + seam.toFixed(3) + ")";
  g.fillRect(dx + dw - 2, dy + 3, 2.5, dh - 6);
  if (doorGlow > 0.02){
    const sp = g.createLinearGradient(dx, 0, dx + dw * 2.4, 0);
    sp.addColorStop(0, "rgba(190,220,255," + (doorGlow * 0.16).toFixed(3) + ")");
    sp.addColorStop(1, "rgba(190,220,255,0)");
    g.fillStyle = sp; g.fillRect(dx, dy, dw * 2.4, dh + H * 0.06);
  }

  for (let i = 0; i < Seats.tierY.length; i++){
    const y = Seats.tierY[i] + 2;
    g.fillStyle = i % 2 ? COL.wood2 : COL.wood;
    rr(-10, y, W + 20, Seats.benchH, 3); g.fill();
    g.fillStyle = "rgba(255,195,135,0.06)"; g.fillRect(-10, y, W + 20, 1.5);
    g.fillStyle = "rgba(0,0,0,0.22)"; g.fillRect(-10, y + Seats.benchH, W + 20, 3);
  }
}

// ready: 誰かが打てる状態（石が赤熱する＝いつ来得るかが全員に見える）
// tell : 0→1 で予兆の進行（石が白く光る＝いま来る）
function drawStove(t, hell, ready, tell){
  const cx = W / 2, base = H * 0.82, w = Math.min(118, W * 0.30), h = H * 0.085;
  const F = frameOf(t);

  const glow = g.createRadialGradient(cx, base - h * 0.7, 4, cx, base - h * 0.7, w * 1.9);
  glow.addColorStop(0, "rgba(255,140,50," + (0.30 + hell * 0.22).toFixed(3) + ")");
  glow.addColorStop(1, "rgba(255,100,20,0)");
  g.fillStyle = glow; g.fillRect(cx - w * 2, base - h * 3.4, w * 4, h * 4.6);

  g.fillStyle = "#150e0a"; rr(cx - w / 2, base - h, w, h, 5); g.fill();
  g.fillStyle = "rgba(255,190,130,0.07)"; g.fillRect(cx - w / 2 + 4, base - h, w - 8, 1.5);
  // サウナストーン。冷えていれば暗く、打てるなら赤熱し、予兆の間は白く光る
  const pulse = 0.5 + 0.5 * Math.sin(t / 320);
  for (let i = 0; i < 11; i++){
    const a = unit("st" + i);
    const sx = cx - w / 2 + 8 + (w - 16) * a, sy = base - h + 5 + unit("sy" + i) * (h * 0.42);
    g.fillStyle = i % 3 ? "#2b241f" : "#332b25";
    g.beginPath(); g.ellipse(sx, sy, 5 + a * 4, 4 + a * 2.5, a * 3, 0, 6.284); g.fill();
    let heatA = 0, r = 255, gg = 90, b = 30;
    if (tell > 0){ heatA = 0.35 + 0.65 * tell; r = 255; gg = 235; b = 205; }
    else if (ready){ heatA = 0.30 + 0.34 * pulse; }
    if (heatA > 0){
      g.fillStyle = "rgba(" + r + "," + gg + "," + b + "," + heatA.toFixed(3) + ")";
      g.beginPath(); g.ellipse(sx, sy, 4.4 + a * 3.4, 3.4 + a * 2.1, a * 3, 0, 6.284); g.fill();
    }
  }
  // 予兆。1.8秒しかないので、見落とさない強さで出す
  if (tell > 0){
    const my = base - h * 0.6;
    const tg = g.createRadialGradient(cx, my, 2, cx, my, w * 2.6);
    tg.addColorStop(0, "rgba(255,242,220," + (0.22 + 0.34 * tell).toFixed(3) + ")");
    tg.addColorStop(1, "rgba(255,242,220,0)");
    g.fillStyle = tg; g.fillRect(0, base - h * 5, W, h * 6.5);

    for (let k = 0; k < 2; k++){                               // 石から輪が広がる
      const p = (tell + k * 0.5) % 1;
      g.strokeStyle = "rgba(255,246,228," + ((1 - p) * 0.5).toFixed(3) + ")";
      g.lineWidth = 2.5 * (1 - p) + 0.5;
      g.beginPath(); g.ellipse(cx, my, w * 0.28 + p * w * 1.5, h * 0.2 + p * h * 1.0, 0, 0, 6.284); g.stroke();
    }
    g.fillStyle = "rgba(255,246,232," + (0.05 + 0.10 * tell * tell).toFixed(3) + ")";
    g.fillRect(0, 0, W, H);                                   // 部屋全体が張りつめる
  }

  const y0 = base - h * 0.52, fh = h * (2.1 + hell * 0.8);
  const layers = [
    {n: 4, w: 1.15, h: 1.00, a: "rgba(255,105,25,0.20)", b: "rgba(175,32,4,0)"},
    {n: 5, w: 0.80, h: 0.74, a: "rgba(255,158,52,0.38)", b: "rgba(212,62,9,0)"},
    {n: 4, w: 0.48, h: 0.44, a: "rgba(255,230,182,0.72)", b: "rgba(255,182,88,0)"}
  ];
  for (let L = 0; L < layers.length; L++){
    const ly = layers[L];
    for (let i = 0; i < ly.n; i++){
      const n1 = noise(F / 10 + i * 37.7 + L * 13.3);
      const n2 = noise(F / 15 + i * 91.3 + L * 71.1);
      const n3 = noise(F / 8 + i * 53.1 + L * 29.7);
      const px = cx + (ly.n === 1 ? 0 : (i / (ly.n - 1) - 0.5)) * w * 0.34;
      const hgt = fh * ly.h * (0.62 + 0.48 * n1);
      const lean = (n2 - 0.5) * w * 0.09;
      const wid = (w / (ly.n + 2)) * ly.w * (0.8 + 0.4 * n3);
      const grd = g.createLinearGradient(px, y0, px, y0 - hgt);
      grd.addColorStop(0, ly.a); grd.addColorStop(0.55, ly.a); grd.addColorStop(1, ly.b);
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(px - wid, y0);
      g.bezierCurveTo(px - wid * 0.98, y0 - hgt * 0.34, px - wid * 0.52 + lean, y0 - hgt * 0.76, px + lean, y0 - hgt);
      g.bezierCurveTo(px + wid * 0.52 + lean, y0 - hgt * 0.76, px + wid * 0.98, y0 - hgt * 0.34, px + wid, y0);
      g.closePath(); g.fill();
    }
  }
  const bg2 = g.createRadialGradient(cx, y0, 1, cx, y0, w * 0.3);
  bg2.addColorStop(0, "rgba(255,205,140,0.40)"); bg2.addColorStop(1, "rgba(255,150,60,0)");
  g.fillStyle = bg2; g.beginPath(); g.ellipse(cx, y0, w * 0.3, h * 0.17, 0, 0, 6.284); g.fill();

  for (let i = 0; i < 11; i++){
    const life = ((F * 1.5 + i * 143) % 240) / 240;
    const ex = cx + (noise(F / 26 + i * 11.1) - 0.5) * w * 0.8;
    const ey = y0 - life * fh * 1.15;
    g.fillStyle = "rgba(255,175,90," + ((1 - life) * 0.42).toFixed(3) + ")";
    g.beginPath(); g.arc(ex, ey, 0.9 + (1 - life) * 1.1, 0, 6.284); g.fill();
  }
}

// 熱は数字で出さない。姿勢で見せる（前に屈む・うつむく）
function drawPerson(x, y, s, id, alpha, isMe, heat, slump, stam){
  const t = serverNow();
  const per = 3.2 + unit("p" + id) * 1.9;
  const ph = unit("q" + id) * 6.283;
  const hot = clamp(heat / HEAT_MAX, 0, 1);
  const spent = 1 - clamp((stam === undefined ? STAM_MAX : stam) / STAM_MAX, 0, 1);
  const rate = 1 - hot * 0.45;                                    // 熱いと呼吸が浅く速い
  const br = Math.sin((t / 1000) * (6.283 / (per * rate)) + ph);
  const bh = 46 * s, bw = 30 * s, hr = 9.5 * s;
  // 熱いと前に屈み、体力が尽きてくるとさらに沈む＝数字を見なくても限界が分かる
  const lean = (hot * 0.26 + spent * 0.22 + (slump ? 0.42 : 0)) * bh;
  const top = y - bh * (1 + br * 0.018) + lean;

  g.globalAlpha = alpha;
  if (isMe){
    const fg = g.createRadialGradient(x, y + 3, 1, x, y + 3, 26 * s);
    fg.addColorStop(0, "rgba(255,170,90,0.20)"); fg.addColorStop(1, "rgba(255,170,90,0)");
    g.fillStyle = fg; g.fillRect(x - 30 * s, y - 12, 60 * s, 30);
  }
  const bodyPath = () => rr(x - bw / 2, top + hr * 1.5, bw, bh - hr * 1.2 - lean * 0.5, bw * 0.42);
  const headX = x + lean * 0.30, headY = top + hr * 0.6 + lean * 0.18;
  const headPath = () => { g.beginPath(); g.arc(headX, headY, hr, 0, 6.284); };

  g.fillStyle = COL.body; bodyPath(); g.fill(); headPath(); g.fill();
  const rim = g.createLinearGradient(0, top + bh, 0, top + bh * 0.45);
  rim.addColorStop(0, "rgba(255,150,70,0.16)"); rim.addColorStop(1, "rgba(255,150,70,0)");
  g.fillStyle = rim; bodyPath(); g.fill();
  g.strokeStyle = "rgba(255,168,88," + (0.34 + hot * 0.30).toFixed(3) + ")";
  g.lineWidth = Math.max(1, 1.2 * s);
  bodyPath(); g.stroke(); headPath(); g.stroke();
  g.globalAlpha = 1;
}

function drawSteam(now, events){
  for (const e of events.loyly){
    const a = now - (e.t + LOYLY_TELL);        // 蒸気は予兆のあとに降りてくる
    if (a < 0 || a > 7000) continue;
    const k = a / 7000;
    g.globalAlpha = (1 - k) * 0.30;
    for (let i = 0; i < 16; i++){
      const sx = W * unit("s" + e.t + i), sy = -40 + k * H * 1.15 + noise(now / 200 + i * 7) * 60;
      const r = 30 + unit("r" + e.t + i) * 70;
      const grd = g.createRadialGradient(sx, sy, 1, sx, sy, r);
      grd.addColorStop(0, "rgba(255,240,225,0.5)"); grd.addColorStop(1, "rgba(255,240,225,0)");
      g.fillStyle = grd; g.beginPath(); g.arc(sx, sy, r, 0, 6.284); g.fill();
    }
    g.globalAlpha = 1;
    if (a < 800){
      g.fillStyle = "rgba(255,244,232," + (0.42 * (1 - a / 800)).toFixed(3) + ")";
      g.fillRect(0, 0, W, H);
    }
  }
}

/* ---- 操作は3つだけ。すべて画面の下半分 -------------------------------- */

const Btn = {loyly: null, water: null, move: null};

function drawControls(now, canLoyly, canMove, moveDown, alive){
  const pad = Math.max(10, W * 0.03);
  const bw = (W - pad * 4) / 3, bh = Math.max(64, H * 0.085);
  const by = H - bh - Math.max(20, H * 0.045);
  Btn.loyly = {x: pad, y: by, w: bw, h: bh};
  Btn.water = {x: pad * 2 + bw, y: by, w: bw, h: bh};
  Btn.move  = {x: pad * 3 + bw * 2, y: by, w: bw, h: bh};

  // 体力と熱。数字は出さない。色だけに頼らないよう小さく名前を添える
  const gw = W - pad * 2 - 26;
  const gx = pad + 26;
  const stamY = by - 26, heatY = by - 13;
  const st = clamp(Me.stam / STAM_MAX, 0, 1);
  const hot = clamp(Me.heat / HEAT_MAX, 0, 1);

  g.textAlign = "left"; g.font = "9px sans-serif"; g.globalAlpha = 0.42; g.fillStyle = COL.text;
  g.fillText("体力", pad, stamY + 7); g.fillText("熱", pad, heatY + 7);
  g.globalAlpha = 1;

  g.fillStyle = "rgba(255,255,255,0.07)"; rr(gx, stamY, gw, 7, 3.5); g.fill();
  const sg = g.createLinearGradient(gx, 0, gx + gw, 0);                 // 減ると赤に寄る
  const low = st < 0.25;
  sg.addColorStop(0, low ? "rgba(255,120,70,0.95)" : "rgba(255,214,160,0.92)");
  sg.addColorStop(1, low ? "rgba(255,80,50,0.95)" : "rgba(255,178,110,0.92)");
  g.fillStyle = sg; rr(gx, stamY, Math.max(4, gw * st), 7, 3.5); g.fill();
  if (low){                                                             // 残り少ないと脈打つ
    g.globalAlpha = 0.25 + 0.25 * Math.sin(now / 130);
    g.fillStyle = "rgba(255,120,70,1)"; rr(gx, stamY, Math.max(4, gw * st), 7, 3.5); g.fill();
    g.globalAlpha = 1;
  }

  g.fillStyle = "rgba(255,255,255,0.055)"; rr(gx, heatY, gw, 4, 2); g.fill();
  const hg = g.createLinearGradient(gx, 0, gx + gw, 0);
  hg.addColorStop(0, "rgba(255,160,60,0.7)"); hg.addColorStop(1, "rgba(255,90,40,0.8)");
  g.fillStyle = hg; rr(gx, heatY, Math.max(3, gw * hot), 4, 2); g.fill();

  const face = (b, on, label, sub) => {
    g.fillStyle = on ? "rgba(255,122,26,0.13)" : "rgba(255,255,255,0.035)";
    rr(b.x, b.y, b.w, b.h, 10); g.fill();
    g.strokeStyle = on ? "rgba(255,140,50,0.75)" : "rgba(232,220,208,0.14)";
    g.lineWidth = 1.5; rr(b.x, b.y, b.w, b.h, 10); g.stroke();
    g.textAlign = "center";
    g.fillStyle = on ? COL.core : "rgba(232,220,208,0.30)";
    g.font = Math.min(17, b.w * 0.24).toFixed(0) + "px sans-serif";
    g.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + (sub ? 0 : 6));
    if (sub){
      g.font = "10px sans-serif"; g.globalAlpha = 0.6;
      g.fillText(sub, b.x + b.w / 2, b.y + b.h / 2 + 17); g.globalAlpha = 1;
    }
  };

  face(Btn.loyly, canLoyly && !Me.out, "ロウリュ", canLoyly ? null : "ストーブが冷えていない");
  face(Btn.water, Me.water > 0 && !Me.out, "水", null);
  // 桶の残りは点で見せる
  for (let i = 0; i < WATER_MAX; i++){
    const cx2 = Btn.water.x + Btn.water.w / 2 + (i - (WATER_MAX - 1) / 2) * 12;
    g.beginPath(); g.arc(cx2, Btn.water.y + Btn.water.h / 2 + 18, 3.2, 0, 6.284);
    g.fillStyle = i < Me.water ? "rgba(255,208,138,0.85)" : "rgba(232,220,208,0.16)"; g.fill();
  }
  face(Btn.move, canMove && !Me.out, moveDown ? "下がる" : "上がる",
       moveDown ? (canMove ? null : "下段は満席") : null);
}

function drawTop(aliveCount, temp, rs, hell){
  g.textAlign = "left"; g.font = "13px sans-serif";
  g.fillStyle = COL.text; g.globalAlpha = 0.72;
  g.fillText("残り " + aliveCount + "人", 16, 30);
  g.textAlign = "right";
  g.globalAlpha = hell > 0.5 ? 0.95 : 0.72;
  g.fillStyle = hell > 0.5 ? COL.fire : COL.text;
  g.fillText(temp.toFixed(1) + "℃", W - 16, 30);
  g.globalAlpha = 1;
  if (rs.running){                                    // 回の残り時間は線だけ（数字を主役にしない）
    g.fillStyle = "rgba(255,140,50,0.30)";
    g.fillRect(0, 0, W * (rs.left / ROUND_MS), 2.5);
  }
}

/* ---- 本体 -------------------------------------------------------------- */

const App = {
  screen: "door",
  events: {loyly: [], door: []},
  prev: null, seenLoyly: {}, doorGlow: 0,
  pressedAt: 0,                    // 部屋で最後にひしゃくが動いた時刻（予兆の開始）
  roomLoyly: 0,                    // 蒸気が実際に降りた時刻
  banner: null,                    // {text, until}
  wasAlive: true,

  enter(){
    Audio_.start();
    const open = isOpen(serverNow());
    this.screen = open ? "sauna" : "locker";
    Audio_.door(); this.doorGlow = 1;
    Me.reset(roundState(serverNow()).idx);
    Net.join();
  },

  tap(x, y){
    if (this.screen === "door") return this.enter();
    if (this.screen !== "sauna" || Me.out) return;
    const rs = roundState(serverNow());
    if (!rs.running) return;
    const now = serverNow();
    const hit = b => b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

    if (hit(Btn.loyly)){
      if (Seats.tierOf(me) === Seats.tiers - 1) return;              // 下段からは手が届かない
      if (now - this.pressedAt < LOYLY_ROOM) return;                 // ストーブが冷えていない
      if (now - Me.lastLoyly < LOYLY_SELF) return;
      Me.lastLoyly = now; Net.sendLoyly(); return;
    }
    if (hit(Btn.water)){
      if (Me.water <= 0) return;
      Me.water--; Me.heat = Math.max(0, Me.heat + WATER_COOL);
      Audio_.water(); Net.push(); return;
    }
    if (hit(Btn.move)){
      const last = Seats.tiers - 1, cur = Seats.tierOf(me);
      const want = cur < last ? cur + 1 : cur - 1;
      if (want < 0) return;
      Me.tier = want; Audio_.move(); Net.push(); return;
    }
  },

  digest(people, now){
    const ids = new Set(people.map(p => p.id));
    if (this.prev && Net.seen){
      let ch = 0;
      for (const id of ids) if (!this.prev.has(id)) ch++;
      for (const id of this.prev) if (!ids.has(id)) ch++;
      if (ch > 0){ this.events.door.push({t: now}); if (this.screen === "sauna"){ Audio_.door(); this.doorGlow = 1; } }
    }
    this.prev = ids;

    // 新しいロウリュ。押された時点では効かない。まず予兆の音だけ鳴る
    for (const k in Net.loyly){
      const e = Net.loyly[k];
      if (!e || typeof e.t !== "number" || this.seenLoyly[k]) continue;
      this.seenLoyly[k] = 1;
      if (e.t > this.pressedAt) this.pressedAt = e.t;
      if (now - e.t < 8000){
        this.events.loyly.push({t: e.t, applied: false});
        if (this.screen === "sauna" && now - e.t < LOYLY_TELL) Audio_.hiss();
      }
    }
    // 予兆が切れた瞬間に降りてくる。ここで初めて熱が乗る
    for (const e of this.events.loyly){
      if (e.applied || now < e.t + LOYLY_TELL) continue;
      e.applied = true;
      this.roomLoyly = e.t + LOYLY_TELL;
      if (this.screen === "sauna"){
        Audio_.loyly();
        if (!Me.out) Me.heat = clamp(Me.heat + LOYLY_HEAT, 0, HEAT_MAX);   // 押した人にも乗る
      }
    }
    this.events.loyly = this.events.loyly.filter(e => now - e.t < 30000);
    this.events.door = this.events.door.filter(e => now - e.t < 9000);
  },

  // 熱と体力の進行。自分のぶんだけ計算し、心拍で他人に伝える
  tick(now, dt, rs){
    if (!rs.running || Me.out) return;
    const eq = heatEquilibrium(Seats.tierOf(me), Seats.tiers, now - this.roomLoyly < 8000);
    Me.heat = clamp(Me.heat + (eq - Me.heat) * HEAT_K * dt, 0, HEAT_MAX);
    Me.stam = Math.max(0, Me.stam - drainRate(Me.heat) * dt);
    if (Me.stam <= 0){
      Me.out = true; Audio_.out();
      this.banner = {text: "のぼせた", until: now + 2200};
      Net.push();
    }
  },

  fidget(people, now){
    if (this.screen !== "sauna") return;
    const b = Math.floor(now / 1000);
    for (const p of people)
      if (!p.out && hash32(p.id + ":" + b) % 11 === 0){ Audio_.cloth(now); break; }
  },

  last: 0,
  frame(){
    const now = serverNow();
    const dt = this.last ? Math.min(0.25, (now - this.last) / 1000) : 0;
    this.last = now;
    this.doorGlow = Math.max(0, this.doorGlow - 0.028);

    if (this.screen === "locker" && isOpen(now)){ this.screen = "sauna"; Audio_.door(); this.doorGlow = 1; Me.reset(roundState(now).idx); }
    if (this.screen === "sauna" && !isOpen(now)) this.screen = "locker";
    if (this.screen === "door") return this.drawDoorScreen(now);

    const all = Net.present();
    if (this.screen === "locker") return this.drawLocker(all, now);

    const rs = roundState(now);
    const here = all.filter(p => p.s === "i");
    if (rs.idx !== Me.round){                                 // 回が変わったら全員やり直し
      const wasOut = Me.out;
      Me.reset(rs.idx); Net.push();
      if (wasOut) this.banner = {text: "つぎの回", until: now + 1500};
    }
    // 他人は publish された値を使う。回が古い人はまだ前の回の値なので生存扱いにしない
    const inRound = here.map(p => Object.assign({}, p, {out: p.out || p.r !== rs.idx && p.out}));
    const alive = inRound.filter(p => !p.out);

    this.digest(here, now);
    this.fidget(here, now);
    this.tick(now, dt, rs);

    if (rs.running && alive.length === 1 && here.length > 1 && this.wasAlive){
      if (alive[0].id === me){ Audio_.win(); this.banner = {text: "ととのった", until: now + 3000}; }
      this.wasAlive = false;
    }
    if (!rs.running) this.wasAlive = true;

    const temp = temperature(alive.length, now, this.events);
    const hell = clamp((temp - 90) / 14, 0, 1);

    // 予兆の進行。誰かが打った直後だけ 0→1 になる
    const sinceP = now - this.pressedAt;
    const tell = (sinceP >= 0 && sinceP < LOYLY_TELL) ? sinceP / LOYLY_TELL : 0;
    const stoveReady = rs.running && sinceP >= LOYLY_ROOM;

    drawRoom(this.doorGlow);
    drawStove(now, hell, stoveReady, tell);

    Seats.ensure(alive.length);
    Seats.assign(inRound);

    for (const gh of Seats.ghosts){
      const s = Seats.list[gh.seat]; if (!s) continue;
      drawPerson(s.x, s.y, s.s, gh.id, (1 - (performance.now() - gh.t) / SEAT_FADE) * 0.5, false, 0, false);
    }
    const order = alive.slice().sort((a, b) => (Seats.map[a.id] ?? 0) - (Seats.map[b.id] ?? 0));
    for (const p of order){
      const s = Seats.list[Seats.map[p.id]]; if (!s) continue;
      drawPerson(s.x, s.y, s.s, p.id, 1, p.id === me,
                 p.id === me ? Me.heat : p.heat, false,
                 p.id === me ? Me.stam : p.stam);
    }
    // 出された人は床に座り込んで見ている（部屋から消えない＝人が減らない）
    const outs = inRound.filter(p => p.out);
    for (let i = 0; i < outs.length; i++){
      const x = W * (0.10 + 0.80 * (outs.length === 1 ? 0.5 : i / (outs.length - 1)));
      drawPerson(x, H * 0.655, 0.70, outs[i].id, 0.42, outs[i].id === me, HEAT_MAX, true, 0);
    }

    drawSteam(now, this.events);
    if (hell > 0){
      g.globalAlpha = hell * 0.16; g.fillStyle = COL.fire;
      const wob = Math.sin(now / 90) * 2;
      for (let i = 0; i < 5; i++) g.fillRect(0, H * (0.3 + i * 0.14) + wob, W, 1.5);
      g.globalAlpha = 1;
    }

    const canLoyly = rs.running && now - this.pressedAt >= LOYLY_ROOM
                     && now - Me.lastLoyly >= LOYLY_SELF && Seats.tierOf(me) !== Seats.tiers - 1;
    const cur = Seats.tierOf(me), last = Seats.tiers - 1;
    const moveDown = cur < last;
    const canMove = rs.running && (moveDown ? Seats.freeIn(cur + 1, inRound) : true);
    drawTop(alive.length, temp, rs, hell);
    drawControls(now, canLoyly, canMove, moveDown, alive.length);

    if (!rs.running){                                          // 回の間
      g.fillStyle = "rgba(8,6,5,0.55)"; g.fillRect(0, 0, W, H);
      g.textAlign = "center"; g.fillStyle = COL.text;
      g.globalAlpha = 0.9; g.font = "18px sans-serif";
      g.fillText("つぎの回は " + Math.ceil(rs.toNext / 1000) + "秒後", W / 2, H * 0.44);
      g.globalAlpha = 0.45; g.font = "12px sans-serif";
      g.fillText("いま " + here.length + "人", W / 2, H * 0.44 + 26);
      g.globalAlpha = 1;
    }
    if (this.banner && now < this.banner.until){
      const k = 1 - (this.banner.until - now) / 3000;
      g.textAlign = "center"; g.globalAlpha = clamp(1.6 - Math.abs(k - 0.3) * 2.4, 0, 1);
      g.fillStyle = COL.core; g.font = "26px sans-serif";
      g.fillText(this.banner.text, W / 2, H * 0.24);
      g.globalAlpha = 1;
    }
  },

  drawDoorScreen(now){
    g.fillStyle = COL.bg; g.fillRect(0, 0, W, H);
    const w = Math.min(190, W * 0.52), h = Math.min(300, H * 0.44);
    const x = (W - w) / 2, y = (H - h) / 2 - 14;
    const glow = g.createRadialGradient(x + w, y + h / 2, 2, x + w, y + h / 2, w * 1.5);
    glow.addColorStop(0, "rgba(255,150,60,0.17)"); glow.addColorStop(1, "rgba(255,150,60,0)");
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    g.fillStyle = "#1a110c"; rr(x, y, w, h, 6); g.fill();
    g.strokeStyle = "rgba(255,190,130,0.12)"; g.lineWidth = 1; rr(x + 9, y + 9, w - 18, h - 18, 4); g.stroke();
    g.fillStyle = "rgba(255,190,130,0.16)"; rr(x + w - 20, y + h / 2 - 13, 4, 26, 2); g.fill();
    const p = 0.5 + Math.sin(now / 900) * 0.28;
    g.fillStyle = "rgba(255,190,120," + (0.18 + p * 0.4).toFixed(3) + ")";
    g.fillRect(x + w - 3, y + 6, 3, h - 12);
    g.fillStyle = COL.text; g.globalAlpha = 0.5; g.textAlign = "center"; g.font = "13px sans-serif";
    g.fillText("ふれて入る", W / 2, y + h + 40); g.globalAlpha = 1;
  },

  drawLocker(all, now){
    const grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, "#0a0806"); grd.addColorStop(1, "#141010");
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    const by = H * 0.60;
    g.fillStyle = COL.wood; rr(-10, by, W + 20, H * 0.03, 3); g.fill();
    const wait = all.slice(0, 9);
    for (let i = 0; i < wait.length; i++){
      const n = wait.length, x = n === 1 ? W / 2 : W * 0.14 + (W * 0.72) * (i / (n - 1));
      drawPerson(x, by, 0.92, wait[i].id, 0.55, wait[i].id === me, 0, false);
    }
    const at = nextOpenAt(now), left = Math.max(0, at - now);
    const mm = String(Math.floor(left / 60000)).padStart(2, "0");
    const ss = String(Math.floor(left / 1000) % 60).padStart(2, "0");
    g.textAlign = "center"; g.fillStyle = COL.text;
    g.globalAlpha = 0.9; g.font = "19px sans-serif"; g.fillText("次は " + clockLabel(at) + " に開きます", W / 2, H * 0.30);
    g.globalAlpha = 0.55; g.font = "13px sans-serif"; g.fillText("いま " + all.length + "人が待っています", W / 2, H * 0.30 + 30);
    g.globalAlpha = 0.32; g.font = "30px sans-serif"; g.fillText(mm + ":" + ss, W / 2, H * 0.30 + 78);
    g.globalAlpha = 1;
  }
};

cv.addEventListener("pointerdown", e => { e.preventDefault(); App.tap(e.clientX, e.clientY); });

resize();
(function loop(){ App.frame(); requestAnimationFrame(loop); })();
</script>
